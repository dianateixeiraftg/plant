<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construtor do Livro dos Finalistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#F4B740;
    --sky:#4C8FBD;
    --grass:#4E9A6F;
    --coral:#E8615A;
    --paper:#FBF5E6;
    --ink:#2B2A26;
    --ink-soft:#5B584F;
    --line:#E4D9BE;
    --card:#FFFFFF;

    /* cores dos menus (editáveis em Definições) */
    --m-head:#f4b740;
    --m-head-text:#2b2a26;
    --m-editor-bg:#ffffff;
    --m-border:#2b2a26;
    --m-tab-bg:#fbf5e6;
    --m-tab-text:#2b2a26;
    --m-tab-active:#e8615a;
    --m-tab-active-text:#ffffff;
    --m-toolbar:#2b2a26;
    --m-toolbar-text:#ffffff;
    --m-btn:#f4b740;
    --m-btn-text:#3a2c05;
    --m-add:#4c8fbd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#EFE7D2;color:var(--ink);font-family:'Karla',sans-serif;}
  h1,h2,h3,h4{font-family:'Baloo 2',sans-serif;margin:0 0 .3em 0;}
  button{font-family:'Karla',sans-serif;cursor:pointer;}
  input,textarea,select{font-family:'Karla',sans-serif;}

  /* ---------- App shell ---------- */
  .app{display:flex;min-height:100vh;}
  .editor{
    width:400px;flex:0 0 400px;background:var(--m-editor-bg);border-right:3px solid var(--m-border);
    display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
  }
  .editor-head{padding:18px 20px 12px;border-bottom:3px solid var(--m-border);background:var(--m-head);color:var(--m-head-text);}
  .editor-head h1{font-size:1.35rem;line-height:1.15;}
  .editor-head p{margin:.3em 0 0;font-size:.85rem;color:var(--m-head-text);opacity:.85;}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:2px solid var(--line);}
  .tab-btn,.set-tab{
    border:2px solid var(--m-border);background:var(--m-tab-bg);border-radius:999px;padding:6px 12px;
    font-size:.78rem;font-weight:600;color:var(--m-tab-text);
  }
  .tab-btn.active,.set-tab.active{background:var(--m-tab-active);color:var(--m-tab-active-text);}

  .tab-panels{flex:1;overflow-y:auto;padding:18px 20px 60px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:none;}
  .field input[type=text],.field input[type=email],.field textarea,.field select{
    width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem;background:#fff;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sky);}

  .photo-drop{
    border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;background:#FCFAF2;
  }
  .photo-drop .thumb{
    width:56px;height:56px;border-radius:8px;background:#EDE7D4 center/cover no-repeat;flex:0 0 56px;
    display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#9c927a;text-align:center;border:2px solid var(--line);
  }
  .photo-drop input[type=file]{font-size:.72rem;max-width:190px;}
  .small-btn{
    border:2px solid var(--ink);background:#fff;border-radius:8px;padding:4px 8px;font-size:.72rem;font-weight:700;
  }
  .small-btn.danger{border-color:var(--coral);color:var(--coral);}
  .small-btn.primary{background:var(--grass);border-color:var(--grass);color:#fff;}

  .card-block{
    border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:#FEFCF5;position:relative;
  }
  .card-block .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .card-block .card-top strong{font-size:.85rem;}

  .add-row{display:flex;justify-content:center;margin-top:6px;}
  .add-row button{
    background:var(--m-add);color:#fff;border:2px solid var(--m-border);border-radius:999px;padding:8px 18px;font-weight:700;font-size:.85rem;
  }

  .gallery-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .gallery-thumbs .g-thumb{width:64px;height:64px;border-radius:8px;position:relative;border:2px solid var(--line);}
  .gallery-thumbs .g-thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
  .gallery-thumbs .g-thumb button{
    position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--coral);color:#fff;border:none;font-size:.7rem;line-height:1;
  }

  .hint{font-size:.74rem;color:var(--ink-soft);margin-top:4px;line-height:1.4;}

  .switch-row{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:10px;background:#FCFAF2;margin-bottom:10px;}
  .switch-row input{transform:scale(1.3);}

  /* ---------- Stage ---------- */
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
  .toolbar{
    position:sticky;top:0;z-index:5;background:var(--m-toolbar);color:var(--m-toolbar-text);padding:10px 16px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--m-btn);
  }
  .toolbar .brand{font-family:'Baloo 2';font-weight:700;font-size:1.05rem;margin-right:auto;}
  .toolbar button{
    border:2px solid var(--m-toolbar-text);background:transparent;color:var(--m-toolbar-text);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.8rem;white-space:nowrap;
  }
  .toolbar button.filled{background:var(--m-btn);border-color:var(--m-btn);color:var(--m-btn-text);}
  .toolbar input[type=file]{display:none;}
  .mode-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:.8rem;}
  .mode-pill select{background:transparent;color:var(--m-toolbar-text);border:none;font-weight:700;}
  .mode-pill select option{color:#000;}

  .pages{
    flex:1;min-height:0;overflow-y:auto;padding:36px;display:flex;flex-direction:column;align-items:center;gap:34px;background:
      radial-gradient(circle at 20% 20%, #f5edd7 0, #EFE7D2 55%);
  }

  .pagina{
    width:210mm;min-height:297mm;background:var(--paper);box-shadow:0 10px 26px rgba(0,0,0,.22);position:relative;
    padding:16mm;overflow:hidden;border-radius:2px;
  }
  .pagina .pg-num{position:absolute;bottom:8mm;right:10mm;font-size:.7rem;color:var(--ink-soft);font-family:'Baloo 2';}
  .pagina .pg-tag{position:absolute;top:8mm;left:10mm;font-size:.62rem;letter-spacing:.06em;color:var(--ink-soft);font-family:'Karla';}

  /* decorative doodle strip */
  .doodle-strip{display:flex;gap:10px;position:absolute;left:0;right:0;height:14px;overflow:hidden;}
  .doodle-strip span{width:14px;height:14px;border-radius:50%;flex:none;}

  /* ---- Página 1: Capa ---- */
  .capa{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;
    background:
      radial-gradient(circle at 15% 12%, rgba(76,143,189,.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(232,97,90,.18), transparent 40%),
      var(--paper);
    border:10px solid var(--ink);
  }
  .capa .escola-nome{font-size:2.1rem;letter-spacing:.01em;color:var(--sky);}
  .capa .ano-letivo{font-size:1.05rem;font-weight:700;color:var(--ink-soft);margin-bottom:26px;}
  .capa .titulo-livro{font-size:3.1rem;color:var(--coral);margin:14px 0 6px;line-height:1;}
  .capa .turma-nome{font-size:1.6rem;font-weight:700;color:var(--grass);margin-bottom:10px;}
  .capa .buyer-line{font-size:1.05rem;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 22px;margin-top:18px;}
  .capa .mascote{margin:22px 0;}

  /* ---- Página 2: diploma ---- */
  .diploma-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .diploma-frame{
    border:8px double var(--coral);border-radius:18px;padding:30px 36px;width:100%;max-width:150mm;background:#fff;
  }
  .aluno-foto-grande{
    width:120px;height:150px;object-fit:cover;border-radius:10px;border:4px solid var(--ink);margin:0 auto 14px;background:#EDE7D4;
    display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.75rem;text-align:center;
  }
  .diploma-frame h2{color:var(--sky);font-size:1.5rem;}
  .diploma-frame .diploma-nome{font-size:1.7rem;color:var(--coral);margin:8px 0;}
  .diploma-frame .diploma-sub{font-size:.85rem;color:var(--ink-soft);}

  /* ---- Página 3: escola ---- */
  .escola-page{height:100%;display:flex;flex-direction:column;}
  .escola-foto{width:100%;height:95mm;border-radius:14px;object-fit:cover;border:4px solid var(--ink);background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;margin-bottom:14px;}
  .escola-morada{font-weight:700;color:var(--grass);margin-bottom:10px;}
  .escola-msg{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;font-size:.95rem;line-height:1.55;white-space:pre-wrap;}
  .escola-msg .assinatura{margin-top:12px;font-family:'Baloo 2';color:var(--sky);font-size:1rem;}

  /* ---- Página 4: equipa ---- */
  .equipa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px;}
  .equipa-card{text-align:center;}
  .equipa-foto{width:100%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:4px solid var(--ink);background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.7rem;margin-bottom:8px;}
  .equipa-card .eq-nome{font-weight:700;font-size:.88rem;}
  .equipa-card .eq-cargo{font-size:.74rem;color:var(--ink-soft);}

  /* ---- Colegas ---- */
  .colegas-wrap{display:flex;flex-direction:column;height:265mm;}
  .colegas-page{flex:1;min-height:0;display:grid;gap:5mm;grid-template-columns:repeat(var(--cols,1),1fr);grid-template-rows:repeat(var(--rows,1),1fr);}
  .colega-card{container:colega / size;min-width:0;min-height:0;background:#fff;border:2px solid var(--line);border-radius:3mm;overflow:hidden;}
  .colega-in{
    --pad:4cqmin;width:100%;height:100%;padding:var(--pad);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--pad)*.7);font-size:min(5.6cqw,4.4cqh,3.8mm);text-align:center;
  }
  .colega-foto{
    flex:none;width:min(70cqw,calc(40cqh*.8333));aspect-ratio:5/6;height:auto;border-radius:.7em;object-fit:cover;
    border:.25em solid var(--sun);background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.8em;text-align:center;
  }
  .colega-info{min-width:0;width:100%;}
  .colega-info .col-nome{font-size:1.3em;line-height:1.1;font-weight:700;color:var(--coral);}
  .colega-info .col-alcunha{font-size:.8em;color:var(--ink-soft);margin-bottom:.4em;}
  .colega-info .col-q{font-size:.85em;margin-top:.4em;line-height:1.2;}
  .colega-info .col-q b{color:var(--sky);}
  @container colega (min-aspect-ratio: 6/5){
    .colega-in{flex-direction:row;justify-content:flex-start;text-align:left;font-size:min(3.4cqw,5.6cqh,3.8mm);}
    .colega-foto{width:min(40cqw,calc((100cqh - 2*var(--pad))*.8333));}
    .colega-info{flex:1;width:auto;}
  }

  /* ---- Galeria / mural ---- */
  .galeria-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:56mm;gap:8px;margin-top:10px;}
  .galeria-grid img,.galeria-grid .g-empty{width:100%;height:100%;object-fit:cover;border-radius:10px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15);}
  .galeria-grid .g-empty{background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.7rem;}
  .galeria-grid .g-item{position:relative;width:100%;height:100%;min-height:0;}
  .g-date{position:absolute;right:9px;bottom:9px;background:rgba(43,42,38,.78);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:999px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  .foto-grupo-page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .foto-grupo-img{width:100%;height:220mm;object-fit:cover;border-radius:14px;border:6px solid var(--ink);background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;}

  .msg-page-body{background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px;font-size:1rem;line-height:1.6;white-space:pre-wrap;min-height:60%;}
  .msg-page-body .assinatura{margin-top:16px;font-family:'Baloo 2';color:var(--sky);}

  .autografos-page{height:100%;display:flex;flex-direction:column;}
  .autografos-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:10px;margin-top:16px;}
  .autografos-grid div{border:2px dashed var(--line);border-radius:12px;}

  .titulo-secao{font-size:1.6rem;color:var(--grass);margin-bottom:4px;}
  .subtitulo-secao{font-size:.85rem;color:var(--ink-soft);margin-bottom:14px;}

  @media print{
    body{background:#fff;}
    .editor,.toolbar,.modal-overlay,.toast{display:none !important;}
    .app{display:block;}
    .stage{height:auto;display:block;}
    .pages{padding:0;gap:0;background:none;overflow:visible;display:block;}
    .pagina{box-shadow:none;border-radius:0;page-break-after:always;margin:0;}
    .pagina:last-child{page-break-after:auto;}
  }
  .capa,.diploma-wrap,.escola-page,.foto-grupo-page,.autografos-page{min-height:265mm;}
  @page{size:A4;margin:0;}

  @media screen and (max-width:900px){
    .editor{position:relative;width:100%;flex:none;height:auto;}
    .app{flex-direction:column;}
    .stage{height:auto;}
    .pagina{width:100%;min-height:auto;padding:6vw;}
    .capa,.diploma-wrap,.escola-page,.colegas-page,.foto-grupo-page,.autografos-page{min-height:0;}
    .colegas-wrap{height:auto;}
    .colegas-page{grid-template-rows:none;grid-auto-rows:calc(110vw / var(--cols,1));}
    .foto-grupo-img{height:110vw;}
  }

  /* ---------- Drag & drop de fotos ---------- */
  .photo-drop.drag-over{border-color:var(--sky);background:#EAF3FA;border-style:solid;}
  .dz-text{font-size:.78rem;line-height:1.45;color:var(--ink-soft);}
  .dz-text input[type=file]{margin-top:4px;font-size:.72rem;max-width:200px;}
  .gallery-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;margin-bottom:6px;}
  .gt-item{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:6px;background:#fff;}
  .gt-item img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none;}
  .gt-meta{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .gt-meta input[type=date]{border:2px solid var(--line);border-radius:8px;padding:3px 6px;font-size:.8rem;width:100%;}
  .gt-show{font-size:.72rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2a26;color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;z-index:300;max-width:90vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .toast[hidden]{display:none;}

  /* ---------- Definições (janela) ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay[hidden]{display:none;}
  .modal{background:#fff;border:3px solid var(--m-border);border-radius:16px;width:min(680px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--m-head);color:var(--m-head-text);border-bottom:3px solid var(--m-border);}
  .modal-head h2{margin:0;font-size:1.25rem;}
  .modal-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px;border-bottom:2px solid var(--line);background:var(--m-editor-bg);}
  .modal-body{flex:1;overflow-y:auto;padding:16px 18px 24px;}
  .modal-foot{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:2px solid var(--line);}
  .modal-foot .small-btn{padding:7px 14px;font-size:.8rem;}
  .set-intro{font-size:.82rem;color:var(--ink-soft);margin:0 0 14px;line-height:1.45;}
  .set-group{margin:20px 0 8px;font-size:1rem;color:var(--grass);border-bottom:2px solid var(--line);padding-bottom:2px;}
  .set-group:first-of-type{margin-top:4px;}
  .color-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .color-row{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#FCFAF2;}
  .color-row .c-label{flex:1;font-size:.78rem;font-weight:700;color:var(--ink-soft);line-height:1.25;}
  .color-row input[type=color]{width:42px;height:30px;border:2px solid var(--ink);border-radius:6px;padding:0;background:none;cursor:pointer;}
  .set-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .set-label .hint{font-weight:500;margin:0;}
  .set-label .small-btn{padding:1px 7px;font-size:.8rem;flex:none;}
  .modal .field textarea{min-height:48px;}
  @media (max-width:600px){ .color-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="app">

  <!-- ============ EDITOR ============ -->
  <aside class="editor">
    <div class="editor-head">
      <h1 data-lbl="head_title">📖 Livro dos Finalistas</h1>
      <p data-lbl="head_sub">Preenche os campos e vê o livro a ganhar vida no lado direito. No fim, exporta em PDF.</p>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="tab-panels" id="panels"></div>
  </aside>

  <!-- ============ STAGE ============ -->
  <main class="stage">
    <div class="toolbar">
      <div class="brand" data-lbl="brand">🎓 Pré-visualização</div>

      <div class="mode-pill">
        <span data-lbl="mode_label">Versão:</span>
        <select id="modoSelect">
          <option value="coletiva" data-lbl="mode_col">Coletiva (igual p/ turma)</option>
          <option value="individual" data-lbl="mode_ind">Premium (individualizada)</option>
        </select>
      </div>

      <button id="btnPrint" class="filled" data-lbl="btn_print">🖨️ Exportar / Imprimir PDF</button>
      <button id="btnSave" data-lbl="btn_save">💾 Guardar progresso</button>
      <button id="btnLoadTrigger" data-lbl="btn_load">📂 Abrir progresso</button>
      <button id="btnSettings" data-lbl="btn_settings">⚙️ Definições</button>
      <input type="file" id="btnLoad" accept="application/json">
    </div>

    <div class="pages" id="pages"></div>
  </main>

</div>

<div class="toast" id="toast" hidden></div>

<!-- ============ DEFINIÇÕES ============ -->
<div class="modal-overlay" id="settingsOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-head">
      <h2 id="settingsTitle">⚙️ Definições</h2>
      <button class="small-btn" id="settingsClose" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-tabs" id="settingsTabs">
      <button class="set-tab active" data-sec="colors">🎨 Cores dos menus</button>
      <button class="set-tab" data-sec="labels">🏷️ Nomes dos botões</button>
      <button class="set-tab" data-sec="texts">✏️ Textos predefinidos</button>
      <button class="set-tab" data-sec="layout">📐 Colegas</button>
    </div>
    <div class="modal-body" id="settingsBody"></div>
    <div class="modal-foot">
      <button class="small-btn danger" id="settingsResetSec">↺ Repor esta secção</button>
      <button class="small-btn primary" id="settingsDone">Concluído</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ESTADO
========================================================= */
let state = {
  escola: { nome:"Escola Básica de ...", anoLetivo:"2025/2026", turma:"4.º A", morada:"", diretorMsg:"" },
  escolaFoto: null,
  equipa: [],           // {id, foto, nome, cargo}

const $ = sel => document.querySelector(sel);

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

const TABS = [
  {id:"capa", label:"Capa & Escola"},
  {id:"finalista", label:"Aluno Finalista"},
  {id:"equipa", label:"Equipa"},
  {id:"colegas", label:"Colegas"},
  {id:"dia", label:"Dia a Dia"},
  {id:"mensagens", label:"Mensagens"},
];

function buildTabs(){
  const tabsEl = $("#tabs"), panelsEl = $("#panels");
  tabsEl.innerHTML = TABS.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" data-tab="${t.id}" data-lbl="tab_${t.id}">${t.label}</button>`).join("");
  panelsEl.innerHTML = TABS.map((t,i)=>`<div class="panel${i===0?' active':''}" data-panel="${t.id}"></div>`).join("");
  tabsEl.addEventListener("click", e=>{
    const btn = e.target.closest(".tab-btn"); if(!btn) return;
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b===btn));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.panel===btn.dataset.tab));
  });
}

function galleryEditor(containerId, arrKey, label){
  return `
    <h3>${label}</h3>
    <div class="photo-drop">
      <div class="thumb">📸</div>
      <div class="dz-text"><b>Arrasta as fotos para aqui</b><br>(do computador ou do Google Fotos)<br>
        <input type="file" accept="image/*" multiple id="${containerId}_input"></div>
    </div>
    <div class="gallery-list" id="${containerId}_thumbs"></div>
  `;
}
async function addPhotos(arrKey, files){
  for(const f of files){ state[arrKey].push(await photoFromFile(f)); }
}
function bindGallery(containerId, arrKey){
  $(`#${containerId}_input`).onchange = async e=>{
    const files = [...e.target.files]; e.target.value = "";
    await addPhotos(arrKey, files);
    render(); renderGalleryThumbs(containerId, arrKey);
  };
  renderGalleryThumbs(containerId, arrKey);
}
function renderGalleryThumbs(containerId, arrKey){
  const wrap = $(`#${containerId}_thumbs`);
  if(!wrap) return;
  wrap.innerHTML = state[arrKey].map(ph=>`
    <div class="gt-item" data-id="${ph.id}">
      <img src="${ph.src}" alt="">
      <div class="gt-meta">
        <input type="date" data-act="date" value="${attr(ph.date||"")}" title="Data da foto">
        <label class="gt-show"><input type="checkbox" data-act="show" ${ph.showDate!==false?"checked":""}> mostrar data no livro</label>
      </div>
      <button class="small-btn danger" data-act="del" title="Remover foto">×</button>
    </div>`).join("") || `<p class="hint">Ainda sem fotos.</p>`;
  wrap.oninput = e=>{
    const it = e.target.closest(".gt-item"); if(!it) return;
    const ph = findById(state[arrKey], it.dataset.id); if(!ph) return;
    if(e.target.dataset.act==="date"){ ph.date = e.target.value; render(); }
    if(e.target.dataset.act==="show"){ ph.showDate = e.target.checked; render(); }
  };
  wrap.onclick = e=>{
    const b = e.target.closest('[data-act="del"]'); if(!b) return;
    const id = b.closest(".gt-item").dataset.id;
    state[arrKey] = state[arrKey].filter(p=>p.id!==id);
    render(); renderGalleryThumbs(containerId, arrKey);
  };
}

/* =========================================================
   PRÉ-VISUALIZAÇÃO / PÁGINAS
========================================================= */
const DOTS = ['var(--sun)','var(--sky)','var(--grass)','var(--coral)'];
function dotStrip(top){
  return `<div class="doodle-strip" style="${top?'top:6mm':'bottom:6mm'}">${DOTS.map(c=>`<span style="background:${c}"></span>`).join("")}</div>`;
}

function paginaWrap(innerHtml, tag, num){
  return `<div class="pagina">${dotStrip(true)}${innerHtml}<div class="pg-num">${T("pg_label")} ${num}</div>${dotStrip(false)}</div>`;
}

function fotoOrPlaceholder(src, cls, placeholderText){
  return src ? `<img class="${cls}" src="${src}">` : `<div class="${cls}">${placeholderText||'sem foto'}</div>`;
}

function galeriaGrid(arr, minSlots){
  const slots = Math.max(arr.length, minSlots||6);
  let html = '<div class="galeria-grid">';
  for(let i=0;i<slots;i++){
    const ph = arr[i];
    if(ph){
      const d = (ph.showDate!==false && ph.date) ? fmtDate(ph.date) : "";
      html += `<div class="g-item"><img src="${ph.src}">${d?`<span class="g-date">${d}</span>`:""}</div>`;
    } else {
      html += `<div class="g-empty">${T("ph_photo")}</div>`;
    }
  }
  html += '</div>';
  return html;
}

function chunk(arr, n){
  const out=[];
  for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n));
  return out;
}

function render(){
  let pageNum = 1;
  const pages = [];
  const individual = state.modo === "individual";
  const v = {
    escola: state.escola.nome, turma: state.escola.turma,
    ano: state.escola.anoLetivo, nome: state.alunoFinalista.nome
  };
  const tag = () => "";   // etiquetas pequenas removidas

  /* ---- Página 1: Capa ---- */
  pages.push(paginaWrap(`
    <div class="capa">
      <div class="ano-letivo">${T("cover_year", v)}</div>
      <div class="escola-nome">${esc(state.escola.nome)}</div>
      <div class="mascote">${T("cover_mascot")}</div>
      <div class="titulo-livro">${T("cover_title")}</div>
      <div class="turma-nome">${esc(state.escola.turma)}</div>
      ${individual && state.alunoFinalista.nome ? `<div class="buyer-line">${T("cover_buyer", v)}</div>` : ``}
    </div>
  `, tag("tag_capa"), pageNum++));

  /* ---- Página 2: Diploma ---- */
  pages.push(paginaWrap(`
    <div class="diploma-wrap">
      <div class="diploma-frame">
        ${fotoOrPlaceholder(state.alunoFinalista.foto, "aluno-foto-grande", T("dip_photo_ph"))}
        <h2>${T("dip_title")}</h2>
        <div class="diploma-nome">${esc(state.alunoFinalista.nome) || T("dip_name_ph")}</div>
        <div class="diploma-sub">${T("dip_sub", v)}</div>
      </div>
    </div>
  `, tag("dip_title"), pageNum++));

  /* ---- Página 3: A Nossa Escola ---- */
  pages.push(paginaWrap(`
    <div class="escola-page">
      <h2 class="titulo-secao">${T("esc_title")}</h2>
      ${fotoOrPlaceholder(state.escolaFoto, "escola-foto", T("esc_photo_ph"))}
      <div class="escola-morada">${esc(state.escola.morada) || T("esc_addr_ph")}</div>
      <div class="escola-msg">${esc(state.escola.diretorMsg) || T("esc_msg_ph")}<div class="assinatura">${T("esc_sign")}</div></div>
    </div>
  `, tag("esc_title"), pageNum++));

  /* ---- Página 4: Equipa ---- */
  pages.push(paginaWrap(`
    <h2 class="titulo-secao">${T("eq_title")}</h2>
    <p class="subtitulo-secao">${T("eq_sub")}</p>
    <div class="equipa-grid">
      ${(state.equipa.length? state.equipa : [{},{},{}]).map(m=>`
        <div class="equipa-card">
          ${fotoOrPlaceholder(m.foto, "equipa-foto", T("ph_photo"))}
          <div class="eq-nome">${esc(m.nome)||T("eq_name_ph")}</div>
          <div class="eq-cargo">${esc(m.cargo)||T("eq_role_ph")}</div>
        </div>
      `).join("")}
    </div>
  `, tag("eq_title"), pageNum++));

  /* ---- Colegas: nº por página e por linha definidos em Definições ---- */
  const CL = colegasLayout();
  const listaColegas = state.colegas.length ? state.colegas : Array.from({length:CL.perPage}, ()=>({}));
  chunk(listaColegas, CL.perPage).forEach(g=>{
    pages.push(paginaWrap(`
      <div class="colegas-wrap">
        <h2 class="titulo-secao">${T("col_title")}</h2>
        <div class="colegas-page" style="--cols:${CL.perRow};--rows:${CL.rows}">
          ${g.map(c=>`
            <div class="colega-card"><div class="colega-in">
              ${fotoOrPlaceholder(c.foto, "colega-foto", T("ph_photo"))}
              <div class="colega-info">
                <div class="col-nome">${esc(c.nome)||T("col_name_ph")}</div>
                <div class="col-alcunha">${T("col_nick")}</div>
                <div class="col-q"><b>${T("col_q1")}</b> ${esc(c.queresSer)||T("col_empty")}</div>
                <div class="col-q"><b>${T("col_q2")}</b> ${esc(c.comida)||T("col_empty")}</div>
                <div class="col-q"><b>${T("col_q3")}</b> ${esc(c.saudades)||T("col_empty")}</div>
              </div>
            </div></div>
          `).join("")}
        </div>
      </div>
    `, tag("col_title"), pageNum++));
  });

  /* ---- Sala de aula: 2 páginas ---- */
  const salaChunks = chunk(state.fotosSala, 6);
  (salaChunks.length? salaChunks : [[]]).slice(0,2).forEach((c,i)=>{
    pages.push(paginaWrap(`
      <h2 class="titulo-secao">${T("sala_title")}</h2>
      <p class="subtitulo-secao">${T("sala_sub")}</p>
      ${galeriaGrid(c, 6)}
    `, tag("sala_title", " "+(i+1)), pageNum++));
  });
  /* ---- Recreio e visitas: 2 páginas ---- */
  const recreioChunks = chunk(state.fotosRecreio, 6);
  (recreioChunks.length? recreioChunks : [[]]).slice(0,2).forEach((c,i)=>{
    pages.push(paginaWrap(`
      <h2 class="titulo-secao">${T("rec_title")}</h2>
      <p class="subtitulo-secao">${T("rec_sub")}</p>
      ${galeriaGrid(c, 6)}
    `, tag("rec_title", " "+(i+1)), pageNum++));
  });

  /* ---- Festas: 1 página ---- */

function bindToolbar(){
  $("#modoSelect").onchange = e=>{ state.modo = e.target.value; render(); };
  $("#btnPrint").onclick = ()=>window.print();

  $("#btnSave").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const nomeArquivo = (state.escola.turma||"livro").replace(/[^\w\-]+/g,"_");
    a.href = url; a.download = `livro-finalistas-${nomeArquivo}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  $("#btnLoadTrigger").onclick = ()=>$("#btnLoad").click();
  $("#btnLoad").onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const loaded = JSON.parse(reader.result);
        state = Object.assign(state, loaded);
        $("#modoSelect").value = state.modo || "coletiva";
        normSettings(); normPhotos(); persistSettings(); applyColors(); applyLabels();
        render(); renderAllPanels();
      }catch(err){ alert("Não foi possível abrir este ficheiro."); }
    };
    reader.readAsText(file);
  };
}

const LAYOUT_DEFS = [
  {key:"colegasPorPagina", label:"Colegas por página", def:6, min:1, max:12},
  {key:"colegasPorLinha",  label:"Colegas por linha",  def:2, min:1, max:4},
];
const DEFS = {colors:COLOR_DEFS, labels:LABEL_DEFS, texts:TEXT_DEFS, layout:LAYOUT_DEFS};
const DEF_MAP = {};
Object.keys(DEFS).forEach(k=>{ DEF_MAP[k] = Object.fromEntries(DEFS[k].map(d=>[d.key,d])); });

function normSettings(){
  const st = state.settings || {};
  state.settings = {colors:st.colors||{}, labels:st.labels||{}, texts:st.texts||{}, layout:st.layout||{}};
}
function loadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
    if(saved) state.settings = saved;
  }catch(e){}
  normSettings();
}
function persistSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings)); }catch(e){}
}

function layoutNum(k){
  const d = DEF_MAP.layout[k];
  let n = parseInt((state.settings.layout||{})[k], 10);
  if(!(n >= d.min)) n = d.def;
  return Math.min(d.max, Math.max(d.min, n));
}
function colegasLayout(){
  const perPage = layoutNum("colegasPorPagina");
  const perRow = Math.min(layoutNum("colegasPorLinha"), perPage);
  return {perPage, perRow, rows: Math.ceil(perPage/perRow)};
}
function layoutSummary(){
  const L = colegasLayout();
  return `${L.perPage} cartão(ões) por página, em ${L.rows} linha(s) de até ${L.perRow}.`;
}

function raw(k){
  const v = state.settings.texts[k];
  return (v !== undefined && v !== null) ? v : DEF_MAP.texts[k].def;
}
/* Texto editável -> HTML seguro. {variáveis} são substituídas; Enter vira <br> */
function T(k, vars){
  let t = raw(k);
  if(vars) t = t.replace(/\{(\w+)\}/g, (m,n)=> (n in vars) ? (vars[n]||"") : m);
  return esc(t).replace(/\n/g,"<br>");
}
function labelVal(k){
  const v = state.settings.labels[k];
  return (v !== undefined && v !== null) ? v : DEF_MAP.labels[k].def;
}

function applyColors(){
  const root = document.documentElement.style;
  COLOR_DEFS.forEach(d=>{
    const v = state.settings.colors[d.key];
    if(v) root.setProperty(d.css, v); else root.removeProperty(d.css);
  });
}
function applyLabels(){
  document.querySelectorAll("[data-lbl]").forEach(el=>{
    const k = el.dataset.lbl;
    if(DEF_MAP.labels[k]) el.textContent = labelVal(k);
  });
}

/* ---------- Janela de definições ---------- */
let settingsSec = "colors";
const attr = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function currentVal(kind, d){
  const v = state.settings[kind][d.key];
  return (v !== undefined && v !== null) ? v : d.def;
}
function groupBy(defs){
  const out = [];
  defs.forEach(d=>{
    let g = out.find(x=>x.name===d.group);
    if(!g){ g = {name:d.group, items:[]}; out.push(g); }
    g.items.push(d);
  });
  return out;
}
function resetBtn(kind, key){
  return `<button type="button" class="small-btn" data-reset="${kind}" data-key="${key}" title="Repor predefinição">↺</button>`;
}
function fieldHtml(kind, d){
  const cur = attr(currentVal(kind, d));
  const input = d.multi
    ? `<textarea rows="2" data-kind="${kind}" data-key="${d.key}">${cur}</textarea>`
    : `<input type="text" data-kind="${kind}" data-key="${d.key}" value="${cur}">`;
  return `<div class="field">
    <div class="set-label"><span>${d.label}${d.vars?` <span class="hint">(podes usar ${d.vars})</span>`:""}</span>${resetBtn(kind,d.key)}</div>
    ${input}
  </div>`;
}

function renderSettings(){
  const body = $("#settingsBody");
  document.querySelectorAll(".set-tab").forEach(b=>b.classList.toggle("active", b.dataset.sec===settingsSec));
  let html = "";
  if(settingsSec==="colors"){
    html += `<p class="set-intro">Escolhe as cores dos menus (painel lateral, separadores, barra superior e botões). As alterações aparecem logo. As cores das páginas do livro não mudam.</p>`;
    groupBy(COLOR_DEFS).forEach(g=>{
      html += `<h4 class="set-group">${g.name}</h4><div class="color-grid">` + g.items.map(d=>`
        <div class="color-row">
          <span class="c-label">${d.label}</span>
          <input type="color" data-kind="colors" data-key="${d.key}" value="${currentVal("colors",d)}">
          ${resetBtn("colors", d.key)}
        </div>`).join("") + `</div>`;
    });
  } else if(settingsSec==="labels"){
    html += `<p class="set-intro">Muda o nome dos botões e separadores. Podes incluir emojis.</p>`;
    groupBy(LABEL_DEFS).forEach(g=>{
      html += `<h4 class="set-group">${g.name}</h4>` + g.items.map(d=>fieldHtml("labels", d)).join("");
    });
  } else if(settingsSec==="layout"){
    html += `<p class="set-intro">Define quantos cartões de colegas aparecem em cada página e em cada linha. Os cartões e o texto ajustam o tamanho automaticamente.</p>`;
    html += LAYOUT_DEFS.map(d=>{
      let opts = "";
      for(let n=d.min;n<=d.max;n++) opts += `<option value="${n}"${n===layoutNum(d.key)?" selected":""}>${n}</option>`;
      return `<div class="field"><div class="set-label"><span>${d.label}</span>${resetBtn("layout", d.key)}</div><select data-kind="layout" data-key="${d.key}">${opts}</select></div>`;
    }).join("");
    html += `<p class="set-intro" id="layoutSummary">${layoutSummary()}</p>`;
  } else {
    html += `<p class="set-intro">Edita os textos fixos que aparecem nas páginas do livro. Os textos “enquanto estiver vazio” só aparecem quando o campo correspondente no editor não está preenchido. Onde vires <b>{chavetas}</b>, o valor é preenchido automaticamente.</p>`;
    groupBy(TEXT_DEFS).forEach(g=>{
      html += `<h4 class="set-group">${g.name}</h4>` + g.items.map(d=>fieldHtml("texts", d)).join("");
    });
  }
  body.innerHTML = html;
}

function afterSettingChange(kind){
  if(kind==="colors") applyColors();
  else if(kind==="labels") applyLabels();
  else if(kind==="layout"){ render(); renderColegasPanel(); const sm = $("#layoutSummary"); if(sm) sm.textContent = layoutSummary(); }
  else render();
  persistSettings();
}

function openSettings(){ $("#settingsOverlay").hidden = false; renderSettings(); }
function closeSettings(){ $("#settingsOverlay").hidden = true; }

function bindSettings(){
  $("#btnSettings").onclick = openSettings;
  $("#settingsClose").onclick = closeSettings;
  $("#settingsDone").onclick = closeSettings;
  $("#settingsOverlay").addEventListener("mousedown", e=>{ if(e.target.id==="settingsOverlay") closeSettings(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#settingsOverlay").hidden) closeSettings(); });

  $("#settingsTabs").addEventListener("click", e=>{
    const b = e.target.closest(".set-tab"); if(!b) return;
    settingsSec = b.dataset.sec; renderSettings();
  });

  const body = $("#settingsBody");
  body.addEventListener("input", e=>{
    const t = e.target, kind = t.dataset.kind; if(!kind) return;
    state.settings[kind][t.dataset.key] = t.value;
    afterSettingChange(kind);
  });
  body.addEventListener("click", e=>{
    const b = e.target.closest("[data-reset]"); if(!b) return;
    const kind = b.dataset.reset, key = b.dataset.key;
    delete state.settings[kind][key];
    const inp = body.querySelector(`[data-kind="${kind}"][data-key="${key}"]`);
    if(inp) inp.value = DEF_MAP[kind][key].def;
    afterSettingChange(kind);
  });

  $("#settingsResetSec").onclick = ()=>{
    const nomes = {colors:"as cores", labels:"os nomes dos botões", texts:"os textos", layout:"o layout dos colegas"};
    if(!confirm(`Repor ${nomes[settingsSec]} para os valores originais?`)) return;
    state.settings[settingsSec] = {};
    afterSettingChange(settingsSec);
    renderSettings();
  };
}

/* =========================================================
   FOTOS: datas originais (EXIF), drag & drop, Google Fotos
========================================================= */
const pad2 = n => String(n).padStart(2,"0");
function isoFromMs(ms){ const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function fmtDate(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||""); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; }

/* fotos antigas (texto) -> objetos {id, src, date, showDate} */
function normPhotos(){
  ["fotosSala","fotosRecreio","fotosFestas"].forEach(k=>{
    state[k] = (state[k]||[]).map(p=> typeof p === "string"
      ? {id:uid(), src:p, date:"", showDate:true}
      : Object.assign({id:uid(), date:"", showDate:true}, p));
  });
}

/* Lê a data original (EXIF) de um JPEG: devolve "AAAA-MM-DD" ou "" */
async function readExifDate(blob){
  try{
    const v = new DataView(await blob.slice(0, 262144).arrayBuffer());
    if(v.getUint16(0) !== 0xFFD8) return "";
    let off = 2;
    while(off < v.byteLength - 4){
      if(v.getUint8(off) !== 0xFF) break;
      const marker = v.getUint8(off+1), len = v.getUint16(off+2);
      if(marker === 0xE1 && v.getUint32(off+4) === 0x45786966) return exifDateFromTiff(v, off+10);
      if(marker === 0xDA) break;
      off += 2 + len;
    }
  }catch(e){}
  return "";
}
function exifDateFromTiff(v, t){
  const le = v.getUint16(t) === 0x4949;
  const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
  if(u16(t+2) !== 42) return "";
  const readIfd = ifd => {
    const n = u16(ifd), out = {};
    for(let i=0;i<n;i++){ const e = ifd + 2 + i*12; out[u16(e)] = {count:u32(e+4), valOff:e+8}; }
    return out;
  };
  const str = ent => {
    const o = ent.count > 4 ? t + u32(ent.valOff) : ent.valOff;
    let r = ""; for(let i=0;i<ent.count-1;i++) r += String.fromCharCode(v.getUint8(o+i));
    return r;
  };
  const ifd0 = readIfd(t + u32(t+4));
  const exif = ifd0[0x8769] ? readIfd(t + u32(ifd0[0x8769].valOff)) : {};
  const s = (exif[0x9003] && str(exif[0x9003])) || (exif[0x9004] && str(exif[0x9004])) || (ifd0[0x0132] && str(ifd0[0x0132])) || "";
  const m = /^(\d{4}):(\d{2}):(\d{2})/.exec(s);
  return (m && m[1] !== "0000") ? `${m[1]}-${m[2]}-${m[3]}` : "";
}

/* Foto -> {src, date}. Data: EXIF; se não houver, data de modificação do ficheiro */
async function photoFromFile(file){
  const [src, exif] = await Promise.all([fileToDataURL(file), readExifDate(file)]);
  const date = exif || (file.lastModified > 86400000 ? isoFromMs(file.lastModified) : "");
  return {id:uid(), src, date, showDate:true};
}

/* ---------- Importar a partir de um endereço (ex.: Google Fotos) ---------- */
function urlCandidates(u){
  try{
    const host = new URL(u).hostname;
    if(/(^|\.)googleusercontent\.com$/.test(host) || /(^|\.)ggpht\.com$/.test(host)){
      const base = u.replace(/=[^=\/?#]*$/, "");
      return [base + "=d", base + "=w2400-h2400", u];   // original (com EXIF) -> grande -> tal como veio
    }
  }catch(e){}
  return [u];
}
async function fetchImageFile(url){
  let lastErr;
  for(const u of urlCandidates(url)){
    try{
      const r = await fetch(u, {mode:"cors", credentials:"omit"});
      if(!r.ok) throw new Error("HTTP " + r.status);
      const blob = await r.blob();
      if(!/^image\//.test(blob.type)) throw new Error("não é uma imagem");
      return new File([blob], "foto." + (blob.type.split("/")[1]||"jpg").replace("jpeg","jpg"), {type:blob.type, lastModified:0});
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("falhou");
}
function collectUrls(uris, html, text){
  const ok = u => /^(https?:|data:image|blob:)/i.test(u);
  let list = (uris||"").split(/\r?\n/).map(x=>x.trim()).filter(x=>x && !x.startsWith("#") && ok(x));
  if(!list.length && html){
    try{ list = [...new DOMParser().parseFromString(html,"text/html").querySelectorAll("img[src]")].map(i=>i.getAttribute("src")).filter(ok); }catch(e){}
  }
  if(!list.length && text && ok(text.trim())) list = [text.trim()];
  return [...new Set(list)];
}
const isImageFile = f => /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|bmp|avif|heic)$/i.test(f.name||"");

let toastTimer;
function toast(msg, ms){
  const t = $("#toast"); if(!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, ms || 3500);
}

async function handleDrop(zone, p){
  const input = zone.querySelector("input[type=file]"); if(!input) return;
  toast("A importar…", 60000);
  let files = p.files.filter(isImageFile), failed = 0;
  if(!files.length){
    for(const u of collectUrls(p.uris, p.html, p.text)){
      try{ files.push(await fetchImageFile(u)); }catch(err){ failed++; }
    }
  }
  if(!files.length){
    toast(failed
      ? "Não consegui importar esta foto diretamente (o site de origem não o permite). Descarrega a foto para o computador e arrasta o ficheiro."
      : "Não encontrei nenhuma imagem nesse arrastar.", 8000);
    return;
  }
  const dtx = new DataTransfer();
  (input.multiple ? files : files.slice(0,1)).forEach(f=>dtx.items.add(f));
  input.files = dtx.files;
  input.dispatchEvent(new Event("change", {bubbles:true}));
  toast(`${input.multiple ? files.length : 1} foto(s) importada(s)` + (failed ? ` — ${failed} não foi/foram possível.` : "."), 3500);
}

function bindDrop(){
  const zoneOf = e => (e.target && e.target.closest) ? e.target.closest(".photo-drop") : null;
  const clear = () => document.querySelectorAll(".photo-drop.drag-over").forEach(z=>z.classList.remove("drag-over"));
  const wants = dt => !!dt && [...dt.types].some(t => t === "Files" || t === "text/uri-list");
  ["dragenter","dragover"].forEach(ev=>document.addEventListener(ev, e=>{
    if(!wants(e.dataTransfer)) return;
    e.preventDefault();                       // evita que o navegador abra a foto e se perca o trabalho
    const z = zoneOf(e); clear();
    if(z){ z.classList.add("drag-over"); e.dataTransfer.dropEffect = "copy"; }
    else e.dataTransfer.dropEffect = "none";
  }));
  document.addEventListener("dragleave", e=>{ if(!e.relatedTarget) clear(); });
  document.addEventListener("drop", e=>{
    if(!wants(e.dataTransfer)) return;
    e.preventDefault(); clear();
    const z = zoneOf(e);
    if(!z){ toast("Larga as fotos dentro de uma caixa de fotos do painel à esquerda."); return; }
    const dt = e.dataTransfer;                // os dados só existem durante o evento
    handleDrop(z, {files:[...dt.files], uris:dt.getData("text/uri-list"), html:dt.getData("text/html"), text:dt.getData("text/plain")});
  });
}
