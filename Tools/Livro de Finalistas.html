<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construtor do Livro dos Finalistas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#F4B740;
    --sky:#4C8FBD;
    --grass:#4E9A6F;
    --coral:#E8615A;
    --paper:#FBF5E6;
    --ink:#2B2A26;
    --ink-soft:#5B584F;
    --line:#E4D9BE;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#EFE7D2;color:var(--ink);font-family:'Karla',sans-serif;}
  h1,h2,h3,h4{font-family:'Baloo 2',sans-serif;margin:0 0 .3em 0;}
  button{font-family:'Karla',sans-serif;cursor:pointer;}
  input,textarea,select{font-family:'Karla',sans-serif;}

  /* ---------- App shell ---------- */
  .app{display:flex;min-height:100vh;}
  .editor{
    width:400px;flex:0 0 400px;background:var(--card);border-right:3px solid var(--ink);
    display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
  }
  .editor-head{padding:18px 20px 12px;border-bottom:3px solid var(--ink);background:var(--sun);}
  .editor-head h1{font-size:1.35rem;line-height:1.15;}
  .editor-head p{margin:.3em 0 0;font-size:.85rem;color:#4a3c0f;}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:2px solid var(--line);}
  .tab-btn{
    border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 12px;
    font-size:.78rem;font-weight:600;color:var(--ink);
  }
  .tab-btn.active{background:var(--coral);color:#fff;}

  .tab-panels{flex:1;overflow-y:auto;padding:18px 20px 60px;}
  .panel{display:none;}
  .panel.active{display:block;animation:fade .15s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:4px;text-transform:none;}
  .field input[type=text],.field input[type=email],.field textarea,.field select{
    width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem;background:#fff;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sky);}

  .photo-drop{
    border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;background:#FCFAF2;
  }
  .photo-drop .thumb{
    width:56px;height:56px;border-radius:8px;background:#EDE7D4 center/cover no-repeat;flex:0 0 56px;
    display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#9c927a;text-align:center;border:2px solid var(--line);
  }
  .photo-drop input[type=file]{font-size:.72rem;max-width:190px;}
  .small-btn{
    border:2px solid var(--ink);background:#fff;border-radius:8px;padding:4px 8px;font-size:.72rem;font-weight:700;
  }
  .small-btn.danger{border-color:var(--coral);color:var(--coral);}
  .small-btn.primary{background:var(--grass);border-color:var(--grass);color:#fff;}

  .card-block{
    border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:#FEFCF5;position:relative;
  }
  .card-block .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .card-block .card-top strong{font-size:.85rem;}

  .add-row{display:flex;justify-content:center;margin-top:6px;}
  .add-row button{
    background:var(--sky);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 18px;font-weight:700;font-size:.85rem;
  }

  .gallery-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .gallery-thumbs .g-thumb{width:64px;height:64px;border-radius:8px;position:relative;border:2px solid var(--line);}
  .gallery-thumbs .g-thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
  .gallery-thumbs .g-thumb button{
    position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--coral);color:#fff;border:none;font-size:.7rem;line-height:1;
  }

  .hint{font-size:.74rem;color:var(--ink-soft);margin-top:4px;line-height:1.4;}

  .switch-row{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:10px;background:#FCFAF2;margin-bottom:10px;}
  .switch-row input{transform:scale(1.3);}

  /* ---------- Stage ---------- */
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;}
  .toolbar{
    position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 24px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--sun);
  }
  .toolbar .brand{font-family:'Baloo 2';font-weight:700;font-size:1.05rem;margin-right:auto;}
  .toolbar button{
    border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.82rem;
  }
  .toolbar button.filled{background:var(--sun);border-color:var(--sun);color:#3a2c05;}
  .toolbar input[type=file]{display:none;}
  .mode-pill{display:flex;align-items:center;gap:8px;background:#40392c;border-radius:999px;padding:6px 12px;font-size:.8rem;}
  .mode-pill select{background:transparent;color:#fff;border:none;font-weight:700;}
  .mode-pill select option{color:#000;}

  .pages{
    flex:1;overflow-y:auto;padding:36px;display:flex;flex-direction:column;align-items:center;gap:34px;background:
      radial-gradient(circle at 20% 20%, #f5edd7 0, #EFE7D2 55%);
  }

  .pagina{
    width:210mm;min-height:297mm;background:var(--paper);box-shadow:0 10px 26px rgba(0,0,0,.22);position:relative;
    padding:16mm;overflow:hidden;border-radius:2px;
  }
  .pagina .pg-num{position:absolute;bottom:8mm;right:10mm;font-size:.7rem;color:var(--ink-soft);font-family:'Baloo 2';}
  .pagina .pg-tag{position:absolute;top:8mm;left:10mm;font-size:.62rem;letter-spacing:.06em;color:var(--ink-soft);font-family:'Karla';}

  /* decorative doodle strip */
  .doodle-strip{display:flex;gap:10px;position:absolute;left:0;right:0;height:14px;overflow:hidden;}
  .doodle-strip span{width:14px;height:14px;border-radius:50%;flex:none;}

  /* ---- Página 1: Capa ---- */
  .capa{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;
    background:
      radial-gradient(circle at 15% 12%, rgba(76,143,189,.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(232,97,90,.18), transparent 40%),
      var(--paper);
    border:10px solid var(--ink);
  }
  .capa .escola-nome{font-size:2.1rem;letter-spacing:.01em;color:var(--sky);}
  .capa .ano-letivo{font-size:1.05rem;font-weight:700;color:var(--ink-soft);margin-bottom:26px;}
  .capa .titulo-livro{font-size:3.1rem;color:var(--coral);margin:14px 0 6px;line-height:1;}
  .capa .turma-nome{font-size:1.6rem;font-weight:700;color:var(--grass);margin-bottom:10px;}
  .capa .buyer-line{font-size:1.05rem;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 22px;margin-top:18px;}
  .capa .mascote{margin:22px 0;}

  /* ---- Página 2: diploma ---- */
  .diploma-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .diploma-frame{
    border:8px double var(--coral);border-radius:18px;padding:30px 36px;width:100%;max-width:150mm;background:#fff;
  }
  .aluno-foto-grande{
    width:120px;height:150px;object-fit:cover;border-radius:10px;border:4px solid var(--ink);margin:0 auto 14px;background:#EDE7D4;
    display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.75rem;text-align:center;
  }
  .diploma-frame h2{color:var(--sky);font-size:1.5rem;}
  .diploma-frame .diploma-nome{font-size:1.7rem;color:var(--coral);margin:8px 0;}
  .diploma-frame .diploma-sub{font-size:.85rem;color:var(--ink-soft);}

  /* ---- Página 3: escola ---- */
  .escola-page{height:100%;display:flex;flex-direction:column;}
  .escola-foto{width:100%;height:95mm;border-radius:14px;object-fit:cover;border:4px solid var(--ink);background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;margin-bottom:14px;}
  .escola-morada{font-weight:700;color:var(--grass);margin-bottom:10px;}
  .escola-msg{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;font-size:.95rem;line-height:1.55;white-space:pre-wrap;}
  .escola-msg .assinatura{margin-top:12px;font-family:'Baloo 2';color:var(--sky);font-size:1rem;}

  /* ---- Página 4: equipa ---- */
  .equipa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px;}
  .equipa-card{text-align:center;}
  .equipa-foto{width:100%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;border:4px solid var(--ink);background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.7rem;margin-bottom:8px;}
  .equipa-card .eq-nome{font-weight:700;font-size:.88rem;}
  .equipa-card .eq-cargo{font-size:.74rem;color:var(--ink-soft);}

  /* ---- Colegas ---- */
  .colegas-page{height:100%;display:flex;flex-direction:column;gap:14mm;justify-content:flex-start;}
  .colega-card{
    display:flex;gap:16px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;flex:1;align-items:flex-start;
  }
  .colega-foto{width:100px;height:120px;border-radius:10px;object-fit:cover;border:4px solid var(--sun);background:#EDE7D4;flex:0 0 100px;display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.7rem;text-align:center;}
  .colega-info .col-nome{font-size:1.15rem;color:var(--coral);}
  .colega-info .col-alcunha{font-size:.78rem;color:var(--ink-soft);margin-bottom:6px;}
  .colega-info .col-q{font-size:.78rem;margin-top:6px;}
  .colega-info .col-q b{color:var(--sky);}

  /* ---- Galeria / mural ---- */
  .galeria-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:56mm;gap:8px;margin-top:10px;}
  .galeria-grid img,.galeria-grid .g-empty{width:100%;height:100%;object-fit:cover;border-radius:10px;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15);}
  .galeria-grid .g-empty{background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;font-size:.7rem;}

  .foto-grupo-page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .foto-grupo-img{width:100%;height:220mm;object-fit:cover;border-radius:14px;border:6px solid var(--ink);background:#EDE7D4;display:flex;align-items:center;justify-content:center;color:#9c927a;}

  .msg-page-body{background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px;font-size:1rem;line-height:1.6;white-space:pre-wrap;min-height:60%;}
  .msg-page-body .assinatura{margin-top:16px;font-family:'Baloo 2';color:var(--sky);}

  .autografos-page{height:100%;display:flex;flex-direction:column;}
  .autografos-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:10px;margin-top:16px;}
  .autografos-grid div{border:2px dashed var(--line);border-radius:12px;}

  .titulo-secao{font-size:1.6rem;color:var(--grass);margin-bottom:4px;}
  .subtitulo-secao{font-size:.85rem;color:var(--ink-soft);margin-bottom:14px;}

  @media print{
    body{background:#fff;}
    .editor,.toolbar{display:none !important;}
    .pages{padding:0;gap:0;background:none;}
    .pagina{box-shadow:none;border-radius:0;page-break-after:always;margin:0;}
    .pagina:last-child{page-break-after:auto;}
  }
  @page{size:A4;margin:0;}

  @media (max-width:900px){
    .editor{position:relative;width:100%;flex:none;height:auto;}
    .app{flex-direction:column;}
    .pagina{width:100%;min-height:auto;padding:6vw;}
    .foto-grupo-img{height:110vw;}
  }
</style>
</head>
<body>

<div class="app">

  <!-- ============ EDITOR ============ -->
  <aside class="editor">
    <div class="editor-head">
      <h1>📖 Livro dos Finalistas</h1>
      <p>Preenche os campos e vê o livro a ganhar vida no lado direito. No fim, exporta em PDF.</p>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="tab-panels" id="panels"></div>
  </aside>

  <!-- ============ STAGE ============ -->
  <main class="stage">
    <div class="toolbar">
      <div class="brand">🎓 Pré-visualização</div>

      <div class="mode-pill">
        <span>Versão:</span>
        <select id="modoSelect">
          <option value="coletiva">Coletiva (igual p/ turma)</option>
          <option value="individual">Premium (individualizada)</option>
        </select>
      </div>

      <button id="btnPrint" class="filled">🖨️ Exportar / Imprimir PDF</button>
      <button id="btnSave">💾 Guardar progresso</button>
      <button id="btnLoadTrigger">📂 Abrir progresso</button>
      <input type="file" id="btnLoad" accept="application/json">
    </div>

    <div class="pages" id="pages"></div>
  </main>

</div>

<script>
/* =========================================================
   ESTADO
========================================================= */
let state = {
  escola: { nome:"Escola Básica de ...", anoLetivo:"2025/2026", turma:"4.º A", morada:"", diretorMsg:"" },
  escolaFoto: null,
  equipa: [],           // {id, foto, nome, cargo}
  colegas: [],          // {id, foto, nome, alcunha, queresSer, comida, saudades}
  fotosSala: [],        // dataURLs
  fotosRecreio: [],
  fotosFestas: [],
  fotoGrupo: null,
  mensagemProfessor: { texto:"", assinatura:"A vossa professora" },
  dedicatoriaPais: { texto:"", assinatura:"A Associação de Pais" },
  alunoFinalista: { foto:null, nome:"" },
  modo: "coletiva"
};

const $ = sel => document.querySelector(sel);
const uid = () => Math.random().toString(36).slice(2,10);

function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* =========================================================
   TABS / PAINÉIS DO EDITOR
========================================================= */
const TABS = [
  {id:"capa", label:"Capa & Escola"},
  {id:"finalista", label:"Aluno Finalista"},
  {id:"equipa", label:"Equipa"},
  {id:"colegas", label:"Colegas"},
  {id:"dia", label:"Dia a Dia"},
  {id:"mensagens", label:"Mensagens"},
];

function buildTabs(){
  const tabsEl = $("#tabs"), panelsEl = $("#panels");
  tabsEl.innerHTML = TABS.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" data-tab="${t.id}">${t.label}</button>`).join("");
  panelsEl.innerHTML = TABS.map((t,i)=>`<div class="panel${i===0?' active':''}" data-panel="${t.id}"></div>`).join("");
  tabsEl.addEventListener("click", e=>{
    const btn = e.target.closest(".tab-btn"); if(!btn) return;
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b===btn));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.panel===btn.dataset.tab));
  });
}

function panel(id){ return document.querySelector(`.panel[data-panel="${id}"]`); }

/* ---------- Painel: Capa & Escola ---------- */
function renderCapaPanel(){
  const p = panel("capa");
  p.innerHTML = `
    <h3>📕 Página 1 — Capa</h3>
    <div class="field"><label>Nome da Escola</label><input type="text" id="f_escolaNome" value="${esc(state.escola.nome)}"></div>
    <div class="field"><label>Ano Letivo</label><input type="text" id="f_anoLetivo" value="${esc(state.escola.anoLetivo)}"></div>
    <div class="field"><label>Nome da Turma</label><input type="text" id="f_turma" value="${esc(state.escola.turma)}"></div>

    <h3>🏫 Página 3 — A Nossa Escola</h3>
    <div class="field"><label>Foto da fachada da escola</label>
      <div class="photo-drop">
        <div class="thumb" id="thumb_escolaFoto">${state.escolaFoto?`<img src="${state.escolaFoto}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'sem foto'}</div>
        <input type="file" accept="image/*" id="f_escolaFoto">
      </div>
    </div>
    <div class="field"><label>Morada</label><input type="text" id="f_morada" value="${esc(state.escola.morada)}"></div>
    <div class="field"><label>Mensagem de despedida do Diretor/Coordenador</label>
      <textarea id="f_diretorMsg" placeholder="Escreve aqui a mensagem...">${esc(state.escola.diretorMsg)}</textarea>
    </div>
  `;
  $("#f_escolaNome").oninput = e=>{state.escola.nome=e.target.value; render();};
  $("#f_anoLetivo").oninput = e=>{state.escola.anoLetivo=e.target.value; render();};
  $("#f_turma").oninput = e=>{state.escola.turma=e.target.value; render();};
  $("#f_morada").oninput = e=>{state.escola.morada=e.target.value; render();};
  $("#f_diretorMsg").oninput = e=>{state.escola.diretorMsg=e.target.value; render();};
  $("#f_escolaFoto").onchange = async e=>{
    if(!e.target.files[0]) return;
    state.escolaFoto = await fileToDataURL(e.target.files[0]);
    render(); renderCapaPanel();
  };
}

/* ---------- Painel: Aluno Finalista (Página 2) ---------- */
function renderFinalistaPanel(){
  const p = panel("finalista");
  p.innerHTML = `
    <h3>🎓 Página 2 — Rosto Personalizado</h3>
    <p class="hint">Este é o diploma individual. Para a <b>versão coletiva</b> podes deixar em branco ou pôr um texto genérico. Para cada <b>versão premium</b>, muda a foto e o nome, ativa "Premium" na barra de topo e exporta o PDF — repete para cada aluno.</p>
    <div class="field"><label>Foto do aluno finalista</label>
      <div class="photo-drop">
        <div class="thumb" id="thumb_alunoFinal">${state.alunoFinalista.foto?`<img src="${state.alunoFinalista.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'sem foto'}</div>
        <input type="file" accept="image/*" id="f_alunoFinalFoto">
      </div>
    </div>
    <div class="field"><label>Nome completo</label><input type="text" id="f_alunoFinalNome" value="${esc(state.alunoFinalista.nome)}"></div>
  `;
  $("#f_alunoFinalNome").oninput = e=>{state.alunoFinalista.nome=e.target.value; render();};
  $("#f_alunoFinalFoto").onchange = async e=>{
    if(!e.target.files[0]) return;
    state.alunoFinalista.foto = await fileToDataURL(e.target.files[0]);
    render(); renderFinalistaPanel();
  };
}

/* ---------- Painel: Equipa (Página 4) ---------- */
function renderEquipaPanel(){
  const p = panel("equipa");
  p.innerHTML = `
    <h3>👩‍🏫 Página 4 — A Equipa Maravilha</h3>
    <p class="hint">Professores, educadores e auxiliares que acompanharam a turma.</p>
    <div id="equipaList"></div>
    <div class="add-row"><button id="addEquipa">+ Adicionar pessoa</button></div>
  `;
  const list = $("#equipaList");
  list.innerHTML = state.equipa.map(m=>`
    <div class="card-block" data-id="${m.id}">
      <div class="card-top"><strong>${m.nome||"Nova pessoa"}</strong><button class="small-btn danger" data-remove="${m.id}">remover</button></div>
      <div class="field"><label>Foto</label>
        <div class="photo-drop">
          <div class="thumb">${m.foto?`<img src="${m.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'sem foto'}</div>
          <input type="file" accept="image/*" data-foto="${m.id}">
        </div>
      </div>
      <div class="field"><label>Nome</label><input type="text" value="${esc(m.nome)}" data-nome="${m.id}"></div>
      <div class="field"><label>Cargo (ex.: Professora, Auxiliar)</label><input type="text" value="${esc(m.cargo)}" data-cargo="${m.id}"></div>
    </div>
  `).join("") || `<p class="hint">Ainda não adicionaste ninguém.</p>`;

  list.querySelectorAll("[data-nome]").forEach(inp=>inp.oninput=e=>{
    findById(state.equipa, e.target.dataset.nome).nome = e.target.value; render();
  });
  list.querySelectorAll("[data-cargo]").forEach(inp=>inp.oninput=e=>{
    findById(state.equipa, e.target.dataset.cargo).cargo = e.target.value; render();
  });
  list.querySelectorAll("[data-foto]").forEach(inp=>inp.onchange=async e=>{
    if(!e.target.files[0]) return;
    findById(state.equipa, e.target.dataset.foto).foto = await fileToDataURL(e.target.files[0]);
    render(); renderEquipaPanel();
  });
  list.querySelectorAll("[data-remove]").forEach(btn=>btn.onclick=e=>{
    state.equipa = state.equipa.filter(m=>m.id!==e.target.dataset.remove);
    render(); renderEquipaPanel();
  });
  $("#addEquipa").onclick = ()=>{
    state.equipa.push({id:uid(), foto:null, nome:"", cargo:""});
    render(); renderEquipaPanel();
  };
}

/* ---------- Painel: Colegas ---------- */
function renderColegasPanel(){
  const p = panel("colegas");
  p.innerHTML = `
    <h3>👥 Os Meus Colegas de Turma</h3>
    <p class="hint">Um perfil por aluno (2 por página no livro final).</p>
    <div id="colegasList"></div>
    <div class="add-row"><button id="addColega">+ Adicionar colega</button></div>
  `;
  const list = $("#colegasList");
  list.innerHTML = state.colegas.map(c=>`
    <div class="card-block" data-id="${c.id}">
      <div class="card-top"><strong>${c.nome||"Novo(a) colega"}</strong><button class="small-btn danger" data-remove="${c.id}">remover</button></div>
      <div class="field"><label>Foto</label>
        <div class="photo-drop">
          <div class="thumb">${c.foto?`<img src="${c.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'sem foto'}</div>
          <input type="file" accept="image/*" data-foto="${c.id}">
        </div>
      </div>
      <div class="field"><label>Nome próprio ou alcunha</label><input type="text" value="${esc(c.nome)}" data-nome="${c.id}"></div>
      <div class="field"><label>O que queres ser quando fores grande?</label><input type="text" value="${esc(c.queresSer)}" data-q1="${c.id}"></div>
      <div class="field"><label>Comida favorita da cantina</label><input type="text" value="${esc(c.comida)}" data-q2="${c.id}"></div>
      <div class="field"><label>Do que vais ter mais saudades?</label><input type="text" value="${esc(c.saudades)}" data-q3="${c.id}"></div>
    </div>
  `).join("") || `<p class="hint">Ainda não adicionaste colegas.</p>`;

  const bindText = (attr, key)=>list.querySelectorAll(`[${attr}]`).forEach(inp=>inp.oninput=e=>{
    findById(state.colegas, e.target.dataset[key]||e.target.getAttribute(attr))[keyMap[attr]] = e.target.value; render();
  });
  const keyMap = {"data-nome":"nome","data-q1":"queresSer","data-q2":"comida","data-q3":"saudades"};
  ["data-nome","data-q1","data-q2","data-q3"].forEach(attr=>{
    list.querySelectorAll(`[${attr}]`).forEach(inp=>{
      inp.oninput = e=>{
        const id = e.target.getAttribute(attr);
        findById(state.colegas, id)[keyMap[attr]] = e.target.value;
        render();
      };
    });
  });
  list.querySelectorAll("[data-foto]").forEach(inp=>inp.onchange=async e=>{
    if(!e.target.files[0]) return;
    findById(state.colegas, e.target.dataset.foto).foto = await fileToDataURL(e.target.files[0]);
    render(); renderColegasPanel();
  });
  list.querySelectorAll("[data-remove]").forEach(btn=>btn.onclick=e=>{
    state.colegas = state.colegas.filter(c=>c.id!==e.target.dataset.remove);
    render(); renderColegasPanel();
  });
  $("#addColega").onclick = ()=>{
    state.colegas.push({id:uid(), foto:null, nome:"", queresSer:"", comida:"", saudades:""});
    render(); renderColegasPanel();
  };
}

/* ---------- Painel: Dia a Dia (galerias) ---------- */
function galleryEditor(containerId, arrKey, label){
  return `
    <h3>${label}</h3>
    <div class="photo-drop">
      <div class="thumb">📸</div>
      <input type="file" accept="image/*" multiple id="${containerId}_input">
    </div>
    <div class="gallery-thumbs" id="${containerId}_thumbs"></div>
  `;
}
function bindGallery(containerId, arrKey){
  $(`#${containerId}_input`).onchange = async e=>{
    for(const file of e.target.files){
      state[arrKey].push(await fileToDataURL(file));
    }
    e.target.value="";
    render(); renderGalleryThumbs(containerId, arrKey);
  };
  renderGalleryThumbs(containerId, arrKey);
}
function renderGalleryThumbs(containerId, arrKey){
  const wrap = $(`#${containerId}_thumbs`);
  if(!wrap) return;
  wrap.innerHTML = state[arrKey].map((src,i)=>`
    <div class="g-thumb"><img src="${src}"><button data-idx="${i}" data-arr="${arrKey}">×</button></div>
  `).join("");
  wrap.querySelectorAll("button").forEach(b=>b.onclick=e=>{
    const arr = e.target.dataset.arr, idx = +e.target.dataset.idx;
    state[arr].splice(idx,1);
    render(); renderGalleryThumbs(containerId, arr);
  });
}
function renderDiaPanel(){
  const p = panel("dia");
  p.innerHTML = `
    ${galleryEditor("sala","fotosSala","🖍️ Páginas 5-6 — Na Sala de Aula")}
    ${galleryEditor("recreio","fotosRecreio","⚽ Páginas 7-8 — Recreio & Visitas de Estudo")}
    ${galleryEditor("festas","fotosFestas","🎉 Página 9 — Momentos Festivos")}
    <h3>📷 Página 10 — A Grande Foto de Grupo</h3>
    <div class="photo-drop">
      <div class="thumb" id="thumb_fotoGrupo">${state.fotoGrupo?`<img src="${state.fotoGrupo}" style="width:100%;height:100%;object-fit:cover;border-radius:6px">`:'sem foto'}</div>
      <input type="file" accept="image/*" id="f_fotoGrupo">
    </div>
  `;
  bindGallery("sala","fotosSala");
  bindGallery("recreio","fotosRecreio");
  bindGallery("festas","fotosFestas");
  $("#f_fotoGrupo").onchange = async e=>{
    if(!e.target.files[0]) return;
    state.fotoGrupo = await fileToDataURL(e.target.files[0]);
    render(); renderDiaPanel();
  };
}

/* ---------- Painel: Mensagens ---------- */
function renderMensagensPanel(){
  const p = panel("mensagens");
  p.innerHTML = `
    <h3>💌 Mensagem do(a) Professor(a)</h3>
    <div class="field"><label>Texto</label><textarea id="f_msgProf" rows="6">${esc(state.mensagemProfessor.texto)}</textarea></div>
    <div class="field"><label>Assinatura</label><input type="text" id="f_msgProfAss" value="${esc(state.mensagemProfessor.assinatura)}"></div>

    <h3>❤️ Dedicatória dos Pais</h3>

    <div class="field"><label>Assinatura</label><input type="text" id="f_dedAss" value="${esc(state.dedicatoriaPais.assinatura)}"></div>

    <p class="hint">A última página do livro é o Espaço para Autógrafos — não precisa de texto, é gerada automaticamente para os miúdos assinarem depois de imprimirem.</p>
  `;
  $("#f_msgProf").oninput = e=>{state.mensagemProfessor.texto=e.target.value; render();};
  $("#f_msgProfAss").oninput = e=>{state.mensagemProfessor.assinatura=e.target.value; render();};
  $("#f_ded").oninput = e=>{state.dedicatoriaPais.texto=e.target.value; render();};
  $("#f_dedAss").oninput = e=>{state.dedicatoriaPais.assinatura=e.target.value; render();};
}

function findById(arr, id){ return arr.find(x=>x.id===id); }
function esc(s){ return (s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function renderAllPanels(){
  renderCapaPanel();
  renderFinalistaPanel();
  renderEquipaPanel();
  renderColegasPanel();
  renderDiaPanel();
  renderMensagensPanel();
}

/* =========================================================
   PRÉ-VISUALIZAÇÃO / PÁGINAS
========================================================= */
const DOTS = ['var(--sun)','var(--sky)','var(--grass)','var(--coral)'];
function dotStrip(top){
  return `<div class="doodle-strip" style="${top?'top:6mm':'bottom:6mm'}">${DOTS.map(c=>`<span style="background:${c}"></span>`).join("")}</div>`;
}

function paginaWrap(innerHtml, tag, num){
  return `<div class="pagina">${dotStrip(true)}<div class="pg-tag">${tag}</div>${innerHtml}<div class="pg-num">Pág. ${num}</div>${dotStrip(false)}</div>`;
}

function fotoOrPlaceholder(src, cls, placeholderText){
  return src ? `<img class="${cls}" src="${src}">` : `<div class="${cls}">${placeholderText||'sem foto'}</div>`;
}

function galeriaGrid(arr, minSlots){
  const slots = Math.max(arr.length, minSlots||6);
  let html = '<div class="galeria-grid">';
  for(let i=0;i<slots;i++){
    html += arr[i] ? `<img src="${arr[i]}">` : `<div class="g-empty">foto</div>`;
  }
  html += '</div>';
  return html;
}

function chunk(arr, n){
  const out=[];
  for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n));
  return out;
}

function render(){
  let pageNum = 1;
  const pages = [];
  const individual = state.modo === "individual";

  /* ---- Página 1: Capa ---- */
  pages.push(paginaWrap(`
    <div class="capa">
      <div class="ano-letivo">Ano Letivo ${esc(state.escola.anoLetivo)}</div>
      <div class="escola-nome">${esc(state.escola.nome)}</div>
      <div class="mascote">🌟🎈📚🖍️🌈</div>
      <div class="titulo-livro">Livro dos<br>Finalistas</div>
      <div class="turma-nome">${esc(state.escola.turma)}</div>
      ${individual && state.alunoFinalista.nome ? `<div class="buyer-line">Exemplar de ${esc(state.alunoFinalista.nome)}</div>` : ``}
    </div>
  `, "Capa", pageNum++));

  /* ---- Página 2: Diploma ---- */
  pages.push(paginaWrap(`
    <div class="diploma-wrap">
      <div class="diploma-frame">
        ${fotoOrPlaceholder(state.alunoFinalista.foto, "aluno-foto-grande", "foto do aluno")}
        <h2>Diploma de Finalista</h2>
        <div class="diploma-nome">${esc(state.alunoFinalista.nome) || "Nome do(a) aluno(a)"}</div>
        <div class="diploma-sub">Concluiu com sucesso mais uma etapa em ${esc(state.escola.nome)}, na ${esc(state.escola.turma)}, no ano letivo de ${esc(state.escola.anoLetivo)}.</div>
      </div>
    </div>
  `, "Rosto Personalizado", pageNum++));

  /* ---- Página 3: A Nossa Escola ---- */
  pages.push(paginaWrap(`
    <div class="escola-page">
      <h2 class="titulo-secao">A Nossa Escola</h2>
      ${fotoOrPlaceholder(state.escolaFoto, "escola-foto", "foto da fachada da escola")}
      <div class="escola-morada">${esc(state.escola.morada) || "Morada da escola"}</div>
      <div class="escola-msg">${esc(state.escola.diretorMsg) || "Mensagem de despedida do Diretor/Coordenador..."}<div class="assinatura">— Direção / Coordenação</div></div>
    </div>
  `, "A Nossa Escola", pageNum++));

  /* ---- Página 4: Equipa ---- */
  pages.push(paginaWrap(`
    <h2 class="titulo-secao">A Equipa Maravilha</h2>
    <p class="subtitulo-secao">Quem caminhou ao nosso lado este ano</p>
    <div class="equipa-grid">
      ${(state.equipa.length? state.equipa : [{},{},{}]).map(m=>`
        <div class="equipa-card">
          ${fotoOrPlaceholder(m.foto, "equipa-foto", "foto")}
          <div class="eq-nome">${esc(m.nome)||"Nome"}</div>
          <div class="eq-cargo">${esc(m.cargo)||"Cargo"}</div>
        </div>
      `).join("")}
    </div>
  `, "A Equipa Maravilha", pageNum++));

  /* ---- Colegas: 2 por página ---- */
  const grupos = chunk(state.colegas.length ? state.colegas : [{},{}], 2);
  grupos.forEach(g=>{
    pages.push(paginaWrap(`
      <h2 class="titulo-secao">Os Meus Colegas de Turma</h2>
      <div class="colegas-page">
        ${g.map(c=>`
          <div class="colega-card">
            ${fotoOrPlaceholder(c.foto, "colega-foto", "foto")}
            <div class="colega-info">
              <div class="col-nome">${esc(c.nome)||"Nome do(a) colega"}</div>
              <div class="col-alcunha">também conhecido(a) por... 😉</div>
              <div class="col-q"><b>Quer ser:</b> ${esc(c.queresSer)||"—"}</div>
              <div class="col-q"><b>Comida preferida da cantina:</b> ${esc(c.comida)||"—"}</div>
              <div class="col-q"><b>Vai ter saudades de:</b> ${esc(c.saudades)||"—"}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `, "Os Meus Colegas", pageNum++));
  });

  /* ---- Sala de aula: 2 páginas ---- */
  const salaChunks = chunk(state.fotosSala, 6);
  (salaChunks.length? salaChunks : [[]]).slice(0,2).forEach((c,i)=>{
    pages.push(paginaWrap(`
      <h2 class="titulo-secao">Na Sala de Aula</h2>
      <p class="subtitulo-secao">Momentos espontâneos a trabalhar, pintar e criar</p>
      ${galeriaGrid(c, 6)}
    `, `Sala de Aula ${i+1}`, pageNum++));
  });
  /* ---- Recreio e visitas: 2 páginas ---- */
  const recreioChunks = chunk(state.fotosRecreio, 6);
  (recreioChunks.length? recreioChunks : [[]]).slice(0,2).forEach((c,i)=>{
    pages.push(paginaWrap(`
      <h2 class="titulo-secao">Hora do Recreio & Visitas de Estudo</h2>
      <p class="subtitulo-secao">Intervalos, jogos no pátio e passeios do ano</p>
      ${galeriaGrid(c, 6)}
    `, `Recreio & Visitas ${i+1}`, pageNum++));
  });

  /* ---- Festas: 1 página ---- */
  pages.push(paginaWrap(`
    <h2 class="titulo-secao">Momentos Festivos</h2>
    <p class="subtitulo-secao">Magusto · Festa de Natal · Carnaval · Dia da Criança</p>
    ${galeriaGrid(state.fotosFestas, 6)}
  `, "Momentos Festivos", pageNum++));

  /* ---- Foto de grupo ---- */
  pages.push(paginaWrap(`
    <div class="foto-grupo-page">
      <h2 class="titulo-secao">A Grande Foto de Grupo</h2>
      ${fotoOrPlaceholder(state.fotoGrupo, "foto-grupo-img", "foto de grupo da turma")}
    </div>
  `, "Foto de Grupo", pageNum++));

  /* ---- Mensagem do professor ---- */
  pages.push(paginaWrap(`
    <h2 class="titulo-secao">Mensagem do(a) Professor(a)</h2>
    <div class="msg-page-body">${esc(state.mensagemProfessor.texto)||"Escreve aqui a tua mensagem para o futuro dos teus alunos..."}<div class="assinatura">— ${esc(state.mensagemProfessor.assinatura)||"A vossa professora"}</div></div>
  `, "Mensagem do(a) Professor(a)", pageNum++));

  /* ---- Dedicatória dos pais ---- */
  pages.push(paginaWrap(`
    <h2 class="titulo-secao">Dedicatória dos Pais</h2>
    <div class="msg-page-body">${esc(state.dedicatoriaPais.texto)||"Espaço para a associação/comissão de pais deixar uma mensagem coletiva de orgulho..."}<div class="assinatura">— ${esc(state.dedicatoriaPais.assinatura)||"A Associação de Pais"}</div></div>
  `, "Dedicatória dos Pais", pageNum++));

  /* ---- Autógrafos ---- */
  pages.push(paginaWrap(`
    <div class="autografos-page">
      <h2 class="titulo-secao">Espaço para Autógrafos</h2>
      <p class="subtitulo-secao">${individual && state.alunoFinalista.nome ? `Álbum de recordações de ${esc(state.alunoFinalista.nome)} — deixem aqui a vossa marca!` : "Deixem aqui a vossa marca! ✏️🎨"}</p>
      <div class="autografos-grid">${"<div></div>".repeat(8)}</div>
    </div>
  `, "Autógrafos", pageNum++));

  $("#pages").innerHTML = pages.join("");
}

/* =========================================================
   TOOLBAR: guardar / carregar / imprimir / modo
========================================================= */
function bindToolbar(){
  $("#modoSelect").onchange = e=>{ state.modo = e.target.value; render(); };
  $("#btnPrint").onclick = ()=>window.print();

  $("#btnSave").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const nomeArquivo = (state.escola.turma||"livro").replace(/[^\w\-]+/g,"_");
    a.href = url; a.download = `livro-finalistas-${nomeArquivo}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  $("#btnLoadTrigger").onclick = ()=>$("#btnLoad").click();
  $("#btnLoad").onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const loaded = JSON.parse(reader.result);
        state = Object.assign(state, loaded);
        $("#modoSelect").value = state.modo || "coletiva";
        render(); renderAllPanels();
      }catch(err){ alert("Não foi possível abrir este ficheiro."); }
    };
    reader.readAsText(file);
  };
}

/* =========================================================
   INIT
========================================================= */
buildTabs();
renderAllPanels();
bindToolbar();
render();
</script>
