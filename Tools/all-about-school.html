<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All About School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --ink:#332A22;
    --line:#C9BEA8;
    --school:#3F7D66;
    --school-soft:#E3F0E9;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:32px 16px;
    background:#E7E1D3;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:4px;
  }

  .toolbar button{
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .toolbar button:hover{ transform:translateY(-1px); }

  .card-wrap{
    position:relative;
    width:620px;
    max-width:92vw;
    padding-top:20px;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    background:var(--paper);
    border-radius:18px;
    padding:46px 34px 30px;
    box-shadow:0 10px 24px rgba(0,0,0,0.14);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 37px, rgba(0,0,0,0.035) 38px);
  }

  .card::before{
    content:"";
    position:absolute;
    inset:12px;
    border:2.5px dashed var(--school);
    border-radius:10px;
    pointer-events:none;
    opacity:0.55;
  }

  .ribbon{
    position:absolute;
    z-index:2;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:var(--school);
    color:#fff;
    padding:12px 30px 10px;
    border-radius:8px;
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:29px;
    letter-spacing:0.5px;
    white-space:nowrap;
    box-shadow:0 4px 8px rgba(0,0,0,0.18);
  }
  .ribbon::before, .ribbon::after{
    content:"";
    position:absolute;
    bottom:-9px;
    width:0; height:0;
    border-style:solid;
  }
  .ribbon::before{
    left:-2px;
    border-width:10px 10px 0 0;
    border-color:color-mix(in srgb, var(--school) 65%, black) transparent transparent transparent;
  }
  .ribbon::after{
    right:-2px;
    border-width:10px 0 0 10px;
    border-color:color-mix(in srgb, var(--school) 65%, black) transparent transparent transparent;
  }

  .top-row{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:22px;
    margin-bottom:2px;
  }

  .top-fields{ display:flex; flex-direction:column; gap:14px; }

  .draw-box{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .draw-box .box{
    width:100%;
    height:190px;
    border:2px solid var(--school);
    border-radius:8px;
    background:#fff;
  }
  .draw-box span{
    font-size:12.5px;
    color:var(--school);
    font-weight:700;
    text-align:center;
    line-height:1.25;
  }

  .field{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .field label{
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    color:var(--ink);
  }
  .field .blank{
    flex:1;
    min-width:60px;
    border-bottom:2px solid var(--line);
    height:1.4em;
  }

  .fields{
    display:flex;
    flex-direction:column;
    gap:11px;
    margin-top:8px;
  }

  .footer-row{
    display:flex;
    gap:24px;
    margin-top:16px;
    padding-top:12px;
    border-top:2px solid var(--school);
  }
  .footer-row .field{ flex:2; }
  .footer-row .field.age{ flex:1; }

  .date-row{ margin-top:10px; }


  /* ---------- answers, editing, settings ---------- */
  :root{ --row:24px; }
  body.blank-print{ --row:34px; }

  .hint{ margin:0; font-size:13px; font-weight:600; color:#6b5f52; text-align:center; }

  .field{ align-items:flex-start; }
  .field label{ line-height:var(--row); }
  .field textarea.blank{
    box-sizing:content-box;
    flex:1;
    min-width:60px;
    display:block;
    height:var(--row);
    min-height:var(--row);
    margin:0; padding:0;
    border:0; border-bottom:2px solid var(--line);
    border-radius:0;
    background:transparent;
    resize:none;
    overflow:hidden;
    outline:none;
    font-family:'Caveat',cursive;
    font-weight:600;
    font-size:21px;
    line-height:var(--row);
    color:#1F3F7A;
  }
  .field textarea.blank:focus{ background:rgba(255,255,255,0.7); }
  body.blank-print .field textarea.blank{ color:transparent; height:var(--row) !important; }

  .settings-btn{
    position:fixed; right:14px; bottom:14px;
    width:38px; height:38px; border-radius:50%;
    border:0; background:transparent;
    font-size:20px; cursor:pointer;
    opacity:0.16; transition:opacity .2s;
    z-index:50;
  }
  .settings-btn:hover, .settings-btn:focus-visible{ opacity:1; background:var(--paper); box-shadow:0 2px 8px rgba(0,0,0,0.25); }

  .settings-panel{
    position:fixed; right:14px; bottom:60px;
    width:240px;
    display:none; flex-direction:column; gap:8px;
    padding:12px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:14px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    z-index:50;
  }
  .settings-panel.open{ display:flex; }
  .settings-panel h4{ margin:0 0 2px; font-size:13px; }
  .settings-panel button, .edit-banner button{
    font-family:inherit; font-weight:700; font-size:13px;
    padding:9px 12px; border-radius:999px;
    border:2px solid var(--ink); background:#fff; color:var(--ink);
    cursor:pointer; text-align:left;
  }

  .edit-banner{
    display:none;
    position:sticky; top:8px; z-index:40;
    width:620px; max-width:92vw;
    align-items:center; justify-content:space-between; gap:12px;
    padding:10px 16px;
    background:#FFF3C4;
    border:2px solid var(--ink); border-radius:12px;
    font-size:13.5px; font-weight:600;
  }
  body.editing .edit-banner{ display:flex; }

  body.editing [contenteditable="true"]{
    outline:2px dashed #B8860B;
    outline-offset:2px;
    background:rgba(255,235,150,0.45);
    cursor:text;
  }
  body.editing .ribbon[contenteditable="true"]{ background:var(--accent, var(--school)); }

  .del{
    display:none;
    flex:none; align-self:center;
    width:22px; height:22px; padding:0;
    border:0; border-radius:50%;
    background:#C0392B; color:#fff;
    font-size:12px; line-height:22px; cursor:pointer;
  }
  body.editing .del{ display:inline-block; }

  .add-q{
    display:none;
    width:100%; margin-top:12px; padding:8px;
    font-family:inherit; font-weight:700; font-size:13px;
    background:transparent; color:var(--ink);
    border:2px dashed var(--line); border-radius:10px;
    cursor:pointer;
  }
  body.editing .add-q{ display:block; }

  @media print{
    body{ background:#fff; padding:0; gap:0; display:block; }
    .toolbar{ display:none; }
    .card-wrap{ page-break-after:always; break-after:page; page-break-inside:avoid; break-inside:avoid; margin:0 auto; }
    .card-wrap:last-child{ page-break-after:auto; break-after:auto; }
    .card{ box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .ribbon{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .settings-btn, .settings-panel, .edit-banner, .hint, .del, .add-q{ display:none !important; }
    body.editing [contenteditable]{ outline:none !important; background:none !important; }
    .field textarea.blank{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btnPrint">🖨️ Print with answers</button>
  <button id="btnPrintBlank">✏️ Print blank (write by hand)</button>
  <button id="btnClear">🧹 Clear answers</button>
</div>
<p class="hint">Type your answers right on the page, or print it blank and write by hand.</p>

<div class="edit-banner" id="editBanner">
  <span>Editing: click any text to change it. ✕ removes a question, ＋ adds one.</span>
  <button id="btnDone">Done</button>
</div>

<button class="settings-btn" id="gear" title="Settings" aria-label="Settings">⚙️</button>
<div class="settings-panel" id="panel">
  <h4>Settings</h4>
  <button id="btnEdit">✏️ Edit the questions</button>
  <button id="btnReset">↺ Reset questions to original</button>
</div>

<!-- SCHOOL - ENGLISH -->
<div class="card-wrap">
  <div class="ribbon">All About School</div>
  <div class="card">
    <div class="top-row">
      <div class="top-fields">
        <div class="field"><label>My school is called</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      </div>
      <div class="draw-box">
        <div class="box"></div>
        <span>Drawing of my school</span>

    </div>
    <div class="fields">
      <div class="field"><label>School is a place where</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>School is for</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>My teacher's name is</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>My teacher helps me by</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>My favorite subject is</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>My favorite thing about school is</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>At school I like to</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>My best friend at school is</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>When I grow up I want to be</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>

<!-- SCHOOL - PORTUGUESE -->
<div class="card-wrap">
  <div class="ribbon">Tudo Sobre a Escola</div>
  <div class="card">
    <div class="top-row">
      <div class="top-fields">
        <div class="field"><label>A minha escola chama-se</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      </div>
      <div class="draw-box">
        <div class="box"></div>
        <span>Desenho da minha escola</span>
      </div>
    </div>
    <div class="fields">
      <div class="field"><label>A escola é um lugar onde</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>A escola serve para</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>A pessoa que me ensina chama-se</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>O(a) meu(minha) professor(a) ajuda-me a</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>A minha disciplina favorita é</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>A coisa de que mais gosto na escola é</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>Na escola gosto de</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>O meu melhor amigo na escola é</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field"><label>Quando crescer quero ser</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
    </div>
    <div class="footer-row">
      <div class="field"><label>Com amor,</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
      <div class="field age"><label>Idade:</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
    </div>
    <div class="field date-row"><label>Data:</label><textarea class="blank" rows="1" spellcheck="false"></textarea></div>
  </div>
</div>


<script>
(function(){
  const KEY = 'allabout-school-v1';
  const wraps = [...document.querySelectorAll('.card-wrap')];
  let editing = false, saveTimer = null;

  const readStore = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } };
  const writeStore = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} };

  const staticEls = w => [...w.querySelectorAll('.ribbon, .draw-box span, .card label')].filter(e => !e.closest('.fields'));
  const staticAns = w => [...w.querySelectorAll('textarea.blank')].filter(t => !t.closest('.fields'));

  function autosize(t){
    if (!t.offsetWidth) return;
    t.style.height = 'auto';
    const h = t.scrollHeight;
    if (h > 10) t.style.height = h + 'px';
  }
  const autosizeAll = () => document.querySelectorAll('textarea.blank').forEach(autosize);

  function makeRow(q, a){
    const d = document.createElement('div');
    d.className = 'field';
    d.innerHTML = '<label></label><textarea class="blank" rows="1" spellcheck="false"></textarea>' +
                  '<button class="del" type="button" title="Remove this question">✕</button>';
    d.querySelector('label').textContent = q;
    d.querySelector('textarea').value = a || '';
    return d;
  }

  function snapshot(){
    return wraps.map(w => ({
      texts: staticEls(w).map(e => e.textContent),
      ans: staticAns(w).map(t => t.value),
      rows: [...w.querySelectorAll('.fields .field')].map(f => ({
        q: f.querySelector('label').textContent,
        a: f.querySelector('textarea').value
      }))
    }));
  }

  function applyState(state){
    if (!Array.isArray(state) || state.length !== wraps.length) return false;
    wraps.forEach((w, i) => {
      const s = state[i] || {};
      const els = staticEls(w), ans = staticAns(w);
      if (Array.isArray(s.texts) && s.texts.length === els.length) els.forEach((e, j) => e.textContent = s.texts[j]);
      if (Array.isArray(s.ans) && s.ans.length === ans.length) ans.forEach((t, j) => t.value = s.ans[j]);
      const box = w.querySelector('.fields');
      if (box && Array.isArray(s.rows)){
        box.innerHTML = '';
        s.rows.forEach(r => box.appendChild(makeRow(r.q, r.a)));
      }
    });
    setEditable(editing);
    autosizeAll();
    return true;
  }

  const save = () => writeStore(snapshot());
  function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }

  function setEditable(on){
    document.querySelectorAll('.ribbon, .draw-box span, .card label').forEach(e => {
      if (on) e.setAttribute('contenteditable', 'true'); else e.removeAttribute('contenteditable');
    });
  }
  function toggleEdit(on){
    editing = on;
    document.body.classList.toggle('editing', on);
    setEditable(on);
    if (!on) save();
  }

  /* init: add "+ add question" buttons, then load saved state (or defaults) */
  wraps.forEach(w => {
    const box = w.querySelector('.fields');
    if (!box) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'add-q'; b.textContent = '＋ Add a question';
    box.insertAdjacentElement('afterend', b);
  });
  const defaults = snapshot();
  if (!applyState(readStore())) applyState(defaults);

  /* events */
  document.addEventListener('input', e => {
    if (e.target.matches && e.target.matches('textarea.blank')) autosize(e.target);
    queueSave();
  });
  document.addEventListener('keydown', e => {
    const t = e.target;
    if (e.key === 'Enter' && t.matches && (t.matches('textarea.blank') || t.isContentEditable)){
      e.preventDefault();
      if (t.isContentEditable) t.blur();
    }
  });
  document.addEventListener('paste', e => {
    if (e.target.isContentEditable){
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ');
      document.execCommand('insertText', false, txt);
    }
  });
  document.addEventListener('click', e => {
    const del = e.target.closest('.del');
    if (del){ del.closest('.field').remove(); save(); return; }
    const add = e.target.closest('.add-q');
    if (add){
      const row = makeRow('New question', '');
      add.previousElementSibling.appendChild(row);
      setEditable(true);
      autosize(row.querySelector('textarea'));
      const l = row.querySelector('label');
      l.focus();
      document.getSelection().selectAllChildren(l);
      save();
      return;
    }
    if (!e.target.closest('#panel') && !e.target.closest('#gear')) panel.classList.remove('open');
  });

  const panel = document.getElementById('panel');
  document.getElementById('gear').addEventListener('click', () => panel.classList.toggle('open'));
  document.getElementById('btnEdit').addEventListener('click', () => { panel.classList.remove('open'); toggleEdit(true); });
  document.getElementById('btnDone').addEventListener('click', () => toggleEdit(false));
  document.getElementById('btnReset').addEventListener('click', () => {
    panel.classList.remove('open');
    if (!confirm('Reset all questions to the original ones? Typed answers in the question list will be cleared too.')) return;
    const cur = snapshot();
    applyState(defaults.map((d, i) => ({ texts: d.texts, ans: cur[i].ans, rows: d.rows })));
    save();
  });
  document.getElementById('btnClear').addEventListener('click', () => {
    if (!confirm('Clear all typed answers?')) return;
    document.querySelectorAll('textarea.blank').forEach(t => { t.value = ''; });
    autosizeAll();
    save();
  });

  /* printing */
  function printNow(blank){
    if (editing) toggleEdit(false);
    const go = () => {
      document.body.classList.toggle('blank-print', blank);
      autosizeAll();
      setTimeout(() => window.print(), 60);
    };
    if (document.fonts && document.fonts.ready){
      document.fonts.load('700 29px Caveat');
      document.fonts.load('600 21px Caveat');
      document.fonts.ready.then(go);
    } else go();
  }
  document.getElementById('btnPrint').addEventListener('click', () => printNow(false));
  document.getElementById('btnPrintBlank').addEventListener('click', () => printNow(true));
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('afterprint', () => document.body.classList.remove('blank-print'));
  window.addEventListener('beforeprint', autosizeAll);
  window.addEventListener('resize', autosizeAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(autosizeAll);
})();
</script>

</body>
</html>
