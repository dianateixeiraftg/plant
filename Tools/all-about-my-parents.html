<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All About My Dad & Mom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --ink:#332A22;
    --line:#C9BEA8;
    --dad:#4A6FA0;
    --dad-soft:#E4ECF6;
    --mom:#C4677E;
    --mom-soft:#F7E5EA;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:32px 16px;
    background:#E7E1D3;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:4px;
  }

  .toolbar button{
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .toolbar button:hover{ transform:translateY(-1px); }

  .card-wrap{
    position:relative;
    width:620px;
    max-width:92vw;
    padding-top:20px;
  }
  .card-wrap.dad{ --accent:var(--dad); }
  .card-wrap.mom{ --accent:var(--mom); }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    background:var(--paper);
    border-radius:18px;
    padding:46px 34px 30px;
    box-shadow:0 10px 24px rgba(0,0,0,0.14);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 39px, rgba(0,0,0,0.035) 40px);
  }

  .card::before{
    content:"";
    position:absolute;
    inset:12px;
    border:2.5px dashed var(--accent);
    border-radius:10px;
    pointer-events:none;
    opacity:0.55;
  }

  .ribbon{
    position:absolute;
    z-index:2;
    top:0;
    left:50%;
    transform:translateX(-50%);
    background:var(--accent);
    color:#fff;
    padding:12px 30px 10px;
    border-radius:8px;
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:30px;
    letter-spacing:0.5px;
    white-space:nowrap;
    box-shadow:0 4px 8px rgba(0,0,0,0.18);
  }
  .ribbon::before, .ribbon::after{
    content:"";
    position:absolute;
    bottom:-9px;
    width:0; height:0;
    border-style:solid;
  }
  .ribbon::before{
    left:-2px;
    border-width:10px 10px 0 0;
    border-color:color-mix(in srgb, var(--accent) 65%, black) transparent transparent transparent;
  }
  .ribbon::after{
    right:-2px;
    border-width:10px 0 0 10px;
    border-color:color-mix(in srgb, var(--accent) 65%, black) transparent transparent transparent;
  }

  .top-row{
    display:flex;
    gap:20px;
    margin-top:22px;
    margin-bottom:8px;
  }

  .top-fields{ flex:1; display:flex; flex-direction:column; gap:14px; }

  .draw-box{
    width:150px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .draw-box .box{
    width:150px;
    height:150px;
    border:2px solid var(--accent);
    border-radius:8px;
    background:#fff;
  }
  .draw-box span{
    font-size:12.5px;
    color:var(--accent);
    font-weight:700;
    text-align:center;
    line-height:1.25;
  }

  .field{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
  }
  .field label{
    font-weight:600;
    font-size:14.5px;
    white-space:nowrap;
    color:var(--ink);
  }
  .field .blank{
    flex:1;
    min-width:60px;
    border-bottom:2px solid var(--line);
    height:1.5em;
  }
  .field.short .blank{ flex:none; width:70px; }
  .field.stack{ flex-direction:column; align-items:stretch; gap:4px; }

  .fields{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:6px;
  }

  .inline-two{ display:flex; gap:24px; }
  .inline-two .field{ flex:1; }

  .footer-row{
    display:flex;
    gap:24px;
    margin-top:18px;
    padding-top:14px;
    border-top:2px solid var(--accent);
  }
  .footer-row .field{ flex:2; }
  .footer-row .field.age{ flex:1; }

  .date-row{ margin-top:12px; }

  @media print{
    body{ background:#fff; padding:0; gap:0; display:block; }
    .toolbar{ display:none; }
    .card-wrap{ page-break-after:always; break-after:page; page-break-inside:avoid; break-inside:avoid; margin:0 auto; }
    .card-wrap:last-child{ page-break-after:auto; break-after:auto; }
    .card{ box-shadow:none; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .ribbon{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="printWhenReady()">🖨️ Print / Save as PDF</button>
</div>

<script>
  function printWhenReady(){
    if (document.fonts && document.fonts.ready){
      document.fonts.load("700 30px Caveat");
      document.fonts.ready.then(() => window.print());
    } else {
      window.print();
    }
  }
</script>
