<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f4f"><title>Expiry Watch</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--text:#1f2420;--mut:#6b726c;--line:#e2e0d6;--acc:#2f6f4f;--accT:#fff;--ok:#2f6f4f;--soon:#b8741a;--bad:#b3362b;box-sizing:border-box}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:16px}h1{font-size:24px;margin:4px 0}.sub,.meta,.hint{color:var(--mut);font-size:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.btn{border:0;border-radius:10px;padding:10px 15px;min-height:42px;background:var(--acc);color:var(--accT);font:inherit;font-weight:650;cursor:pointer}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--bad)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.field{margin:11px 0}.field label{display:block;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit}.drop{border:2px dashed var(--line);border-radius:14px;padding:24px 14px;text-align:center;transition:.15s;background:color-mix(in srgb,var(--card) 88%,var(--acc) 12%)}.drop.drag{border-color:var(--acc);transform:scale(1.01)}.drop img{display:block;max-width:100%;max-height:280px;margin:12px auto;border-radius:10px}.status{min-height:22px;margin-top:8px;color:var(--mut)}.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--bg)}.name{font-weight:750}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:var(--bg)}.empty{text-align:center;padding:32px;color:var(--mut)}dialog{width:min(680px,calc(100% - 20px));max-height:90vh;border:1px solid var(--line);border-radius:15px;padding:0;background:var(--card);color:var(--text)}dialog::backdrop{background:#0008}.dlghead{position:sticky;top:0;background:var(--card);padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;z-index:2}.dlgbody{padding:15px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metadata{white-space:pre-wrap;max-height:130px;overflow:auto;background:var(--bg);padding:9px;border-radius:8px;font:12px/1.35 ui-monospace,monospace}hr{border:0;border-top:1px solid var(--line);margin:18px 0}@media(max-width:560px){.settings-grid{grid-template-columns:1fr}.item{grid-template-columns:56px 1fr}.item>div:last-child{grid-column:2}.top{align-items:center}}
</style></head><body><main>
<div class="top"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><button class="btn ghost" id="settingsBtn">⚙ Settings</button></div>
<div class="row"><input id="q" class="grow" placeholder="Search products" style="padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)"><button class="btn" id="addBtn">📷 Add product</button></div>
<div id="banner"></div><div id="list"></div>

<dialog id="addDlg"><div class="dlghead"><strong id="addHeading">Add product from picture</strong><button class="btn ghost" data-close="addDlg">Close</button></div><div class="dlgbody">
<div id="drop" class="drop" tabindex="0"><strong id="dropTitle">Drop a picture here</strong><div class="hint" id="dropHint">From Files or Google Photos, or click to choose</div><input id="file" type="file" accept="image/*" hidden><img id="preview" hidden alt="Selected product"><div id="ocrStatus" class="status"></div></div>
<div class="settings-grid"><div class="field"><label id="nameLabel" for="fName">Product name</label><input id="fName"></div><div class="field"><label id="brandLabel" for="fBrand">Brand</label><input id="fBrand"></div><div class="field"><label id="expiryLabel" for="fExp">Expiry date</label><input id="fExp" type="date"></div><div class="field"><label id="qtyLabel" for="fQty">Quantity</label><input id="fQty" type="number" min="1" value="1"></div></div>
<details><summary>Photo metadata</summary><div id="meta" class="metadata">No picture selected.</div></details>
<div class="row"><button class="btn" id="saveBtn">Add to catalogue</button><button class="btn ghost" id="clearPhoto">Clear picture</button></div></div></dialog>

<dialog id="settingsDlg"><div class="dlghead"><strong>Settings</strong><button class="btn ghost" data-close="settingsDlg">Close</button></div><div class="dlgbody"><form id="settingsForm">
<h3>Text and labels</h3><div class="settings-grid" id="textSettings"></div><hr><h3>Appearance</h3><div class="settings-grid">
<div class="field"><label>Background</label><input type="color" name="bg"></div><div class="field"><label>Cards</label><input type="color" name="card"></div><div class="field"><label>Text</label><input type="color" name="text"></div><div class="field"><label>Accent</label><input type="color" name="accent"></div><div class="field"><label>Warning</label><input type="color" name="soon"></div><div class="field"><label>Expired</label><input type="color" name="bad"></div></div>
<hr><h3>OCR and catalogue</h3><div class="settings-grid"><div class="field"><label>OCR languages</label><select name="ocrLang"><option value="eng+por">English + Portuguese</option><option value="eng">English</option><option value="por">Portuguese</option><option value="eng+por+spa">English + Portuguese + Spanish</option></select></div><div class="field"><label>Default warning</label><select name="warning"><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></div></div>
<div class="row"><button class="btn" type="submit">Save settings</button><button class="btn ghost" type="button" id="resetSettings">Reset settings</button></div><hr><h3>Data</h3><p class="hint">Export includes catalogue entries, saved thumbnails, retained photo metadata and settings.</p><div class="row"><button class="btn ghost" type="button" id="exportBtn">Export data</button><button class="btn ghost" type="button" id="importBtn">Import data</button><input id="importFile" type="file" accept="application/json" hidden><button class="btn danger" type="button" id="clearAll">Clear catalogue</button></div>
</form></div></dialog>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
const $=id=>document.getElementById(id), KEY='expiry-watch-v4';
const defaults={title:'Expiry Watch',subtitle:'Photograph a product and keep track of its expiry date.',settingsButton:'⚙ Settings',addButton:'📷 Add product',searchPlaceholder:'Search products',addHeading:'Add product from picture',dropTitle:'Drop a picture here',dropHint:'Drop from Files or Google Photos, click to choose, or paste a copied picture (Ctrl+V / Cmd+V)',nameLabel:'Product name',brandLabel:'Brand',expiryLabel:'Expiry date',qtyLabel:'Quantity',saveButton:'Add to catalogue',emptyText:'Nothing here yet. Add a product picture to begin.',bg:'#f6f5f0',card:'#ffffff',text:'#1f2420',accent:'#2f6f4f',soon:'#b8741a',bad:'#b3362b',ocrLang:'eng+por',warning:'7'};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{items:[],settings:{...defaults}};state.settings={...defaults,...state.settings};let current={thumb:'',metadata:null,source:null};let worker=null,workerLang='';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function days(d){return Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5)}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString()}
function applySettings(){const s=state.settings,r=document.documentElement;r.style.setProperty('--bg',s.bg);r.style.setProperty('--card',s.card);r.style.setProperty('--text',s.text);r.style.setProperty('--acc',s.accent);r.style.setProperty('--soon',s.soon);r.style.setProperty('--bad',s.bad);$('title').textContent=s.title;$('subtitle').textContent=s.subtitle;$('settingsBtn').textContent=s.settingsButton;$('addBtn').textContent=s.addButton;$('q').placeholder=s.searchPlaceholder;['addHeading','dropTitle','dropHint','nameLabel','brandLabel','expiryLabel','qtyLabel'].forEach(k=>$(k).textContent=s[k]);$('saveBtn').textContent=s.saveButton;document.title=s.title;render()}
function render(){const s=state.settings,q=$('q').value.toLowerCase(),all=[...state.items].sort((a,b)=>a.expiry.localeCompare(b.expiry)),urgent=all.filter(x=>days(x.expiry)<=Number(x.warning||s.warning));$('banner').innerHTML=urgent.length?`<div class="card"><strong>${urgent.length} item${urgent.length>1?'s':''} need attention</strong></div>`:'';const shown=all.filter(x=>(x.name+' '+(x.brand||'')).toLowerCase().includes(q));$('list').innerHTML=shown.length?shown.map(x=>`<div class="card item"><img class="thumb" src="${x.thumb||''}" alt=""><div><div class="name">${esc(x.name)}${x.qty>1?' ×'+x.qty:''}</div><div class="meta">${esc(x.brand||'')}${x.brand?' · ':''}${fmt(x.expiry)}</div><div class="meta">${x.metadata?.DateTimeOriginal?'Photo: '+new Date(x.metadata.DateTimeOriginal).toLocaleString():x.source?.name?'Photo: '+esc(x.source.name):''}</div></div><div><span class="pill">${days(x.expiry)<0?'Expired':days(x.expiry)+' days'}</span><br><button class="btn ghost" data-del="${x.id}" style="margin-top:6px">Remove</button></div></div>`).join(''):`<div class="empty">${esc(s.emptyText)}</div>`}
async function getWorker(){const lang=state.settings.ocrLang;if(worker&&workerLang===lang)return worker;if(worker)await worker.terminate();if(!window.Tesseract)throw Error('Tesseract.js could not load.');worker=await Tesseract.createWorker(lang,1,{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent=`Reading picture… ${Math.round((m.progress||0)*100)}%`}});workerLang=lang;return worker}
function parseDate(t){t=(t||'').replace(/[Oo]/g,'0');const a=[];let m;const rx=/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})\b/g;while((m=rx.exec(t))){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;let z=new Date(y,mo-1,d);if(z.getFullYear()==y&&z.getMonth()==mo-1&&z.getDate()==d)a.push(z)}if(!a.length)return'';a.sort((x,y)=>x-y);const z=a.find(x=>x>=new Date())||a[0];return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(z.getDate()).padStart(2,'0')}`}
function parseName(t){const bad=/^(exp|expiry|best before|use by|valid|validade|consumir|lote|lot|ingredients|ingredientes|nutrition|peso|weight|www)/i;return (t||'').split(/\r?\n/).map(x=>x.replace(/[^\p{L}\p{N}%&+.'()\- ]/gu,' ').replace(/\s+/g,' ').trim()).filter(x=>x.length>2&&!bad.test(x)&&!/^\d/.test(x)).sort((a,b)=>b.replace(/[^\p{L}]/gu,'').length-a.replace(/[^\p{L}]/gu,'').length)[0]||''}
function thumbFrom(file){return new Promise((res,rej)=>{const im=new Image,u=URL.createObjectURL(file);im.onload=()=>{const c=document.createElement('canvas'),max=360,k=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=u})}
function serialise(v){if(v instanceof Date)return v.toISOString();if(Array.isArray(v))return v.map(serialise);if(v&&typeof v==='object'){const o={};for(const[k,x]of Object.entries(v)){if(typeof x!=='function'&&!(x instanceof ArrayBuffer)&&!ArrayBuffer.isView(x))o[k]=serialise(x)}return o}return v}
async function useFile(file,source='file'){if(!file||!file.type.startsWith('image/'))return;$('ocrStatus').textContent='Reading metadata…';$('preview').src=URL.createObjectURL(file);$('preview').hidden=false;current.source={name:file.name,type:file.type,size:file.size,lastModified:file.lastModified,origin:source};try{current.metadata=window.exifr?serialise(await exifr.parse(file,{tiff:true,exif:true,gps:true,xmp:true,iptc:true,icc:false})):null}catch(e){current.metadata={metadataError:e.message}}current.thumb=await thumbFrom(file);$('meta').textContent=JSON.stringify({file:current.source,exif:current.metadata},null,2);try{const w=await getWorker();const out=await w.recognize(file),text=out.data.text,name=parseName(text),date=parseDate(text);if(name)$('fName').value=name;if(date)$('fExp').value=date;$('ocrStatus').textContent=name&&date?'Product name and expiry date filled automatically.':name?'Product name found. Check or enter the expiry date.':date?'Expiry date found. Check or enter the product name.':'No reliable product details found. Try a clearer picture.'}catch(e){$('ocrStatus').textContent='OCR could not run: '+e.message}}
async function useUrl(url){try{$('ocrStatus').textContent='Importing picture from Google Photos…';const r=await fetch(url,{mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.blob();await useFile(new File([b],'google-photos-image.'+(b.type.split('/')[1]||'jpg'),{type:b.type,lastModified:Date.now()}),'Google Photos')}catch(e){$('ocrStatus').textContent='Google Photos did not provide the image file. Download it or use Google Photos → Share → Save to device, then drop the saved file here. Metadata can only be retained when the original file is supplied.'}}
const drop=$('drop');drop.onclick=e=>{if(!e.target.closest('button'))$('file').click()};drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('file').click()};['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(files[0])return useFile(files[0],'drag-and-drop');const uri=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');if(/^https?:/i.test(uri))useUrl(uri.trim())});$('file').onchange=e=>useFile(e.target.files[0],'file-picker');
async function handlePaste(e){
  const items=[...(e.clipboardData?.items||[])];
  const imageItem=items.find(i=>i.kind==='file'&&i.type.startsWith('image/'));
  if(!imageItem)return;
  e.preventDefault();
  const blob=imageItem.getAsFile();
  if(!blob)return;
  const ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
  const file=new File([blob],blob.name||`pasted-image.${ext}`,{type:blob.type,lastModified:blob.lastModified||Date.now()});
  if(!$('addDlg').open){$('addBtn').click();}
  $('ocrStatus').textContent='Pasted picture received. Reading metadata and OCR…';
  await useFile(file,'clipboard-paste');
}
document.addEventListener('paste',handlePaste);

$('addBtn').onclick=()=>{$('addDlg').showModal();current={thumb:'',metadata:null,source:null};['fName','fBrand','fExp'].forEach(x=>$(x).value='');$('fQty').value=1;$('preview').hidden=true;$('meta').textContent='No picture selected.';$('ocrStatus').textContent=''};$('saveBtn').onclick=()=>{if(!$('fName').value.trim()||!$('fExp').value)return alert('Product name and expiry date are required.');state.items.push({id:crypto.randomUUID(),name:$('fName').value.trim(),brand:$('fBrand').value.trim(),expiry:$('fExp').value,qty:+$('fQty').value||1,warning:+state.settings.warning,thumb:current.thumb,metadata:current.metadata,source:current.source});save();render();$('addDlg').close()};$('clearPhoto').onclick=()=>{current={thumb:'',metadata:null,source:null};$('preview').hidden=true;$('meta').textContent='No picture selected.';$('ocrStatus').textContent=''};
$('list').onclick=e=>{const id=e.target.dataset.del;if(id&&confirm('Remove this product?')){state.items=state.items.filter(x=>x.id!==id);save();render()}};$('q').oninput=render;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
const textKeys=['title','subtitle','settingsButton','addButton','searchPlaceholder','addHeading','dropTitle','dropHint','nameLabel','brandLabel','expiryLabel','qtyLabel','saveButton','emptyText'];$('textSettings').innerHTML=textKeys.map(k=>`<div class="field"><label>${k.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase())}</label><input name="${k}"></div>`).join('');$('settingsBtn').onclick=()=>{const f=$('settingsForm');for(const[k,v]of Object.entries(state.settings))if(f.elements[k])f.elements[k].value=v;$('settingsDlg').showModal()};$('settingsForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);for(const[k,v]of fd)state.settings[k]=v;save();applySettings();$('settingsDlg').close()};$('resetSettings').onclick=()=>{if(confirm('Reset all settings to their defaults?')){state.settings={...defaults};save();applySettings();$('settingsDlg').close()}};
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='expiry-watch-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.items))throw Error('Invalid backup');state={items:x.items,settings:{...defaults,...x.settings}};save();applySettings();alert('Import completed.')}catch(err){alert('Import failed: '+err.message)}};$('clearAll').onclick=()=>{if(confirm('Delete every catalogue item? This cannot be undone.')){state.items=[];save();render()}};
applySettings();
</script></body></html>
