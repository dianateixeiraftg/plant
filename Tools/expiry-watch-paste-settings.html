  if(!(out.name&&out.date)){try{const t=await readLabel(file);methods.push('Tesseract');out={...out,text:t.text,passes:t.passes,name:out.name||t.name,date:out.date||t.date,strong:out.strong||t.strong}}catch(e){errors.push(e.message)}}
  if(useG&&mode!=='first'&&!(out.name&&out.date&&out.strong))try{await fromGemini()}catch(e){errors.push(e.message)}
  out.methods=methods;out.errors=errors;return out}
function parseName(t){const bad=/^(exp|expiry|best before|use by|valid|validade|consumir|lote|lot|ingredients|ingredientes|nutrition|peso|weight|www)/i;return (t||'').split(/\r?\n/).map(x=>x.replace(/[^\p{L}\p{N}%&+.'()\- ]/gu,' ').replace(/\s+/g,' ').trim()).filter(x=>x.length>2&&!bad.test(x)&&!/^\d/.test(x)&&x.replace(/[^\p{L}]/gu,'').length/x.length>.6&&!parseDates(x).length).sort((a,b)=>b.replace(/[^\p{L}]/gu,'').length-a.replace(/[^\p{L}]/gu,'').length)[0]||''}
function thumbFrom(file){return new Promise((res,rej)=>{const im=new Image,u=URL.createObjectURL(file);im.onload=()=>{const c=document.createElement('canvas'),max=360,k=Math.min(1,max/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=u})}
function serialise(v){if(v instanceof Date)return v.toISOString();if(Array.isArray(v))return v.map(serialise);if(v&&typeof v==='object'){const o={};for(const[k,x]of Object.entries(v)){if(typeof x!=='function'&&!(x instanceof ArrayBuffer)&&!ArrayBuffer.isView(x))o[k]=serialise(x)}return o}return v}
async function useFile(file,source='file'){if(!file||!file.type.startsWith('image/'))return;$('ocrStatus').textContent='Reading metadata…';$('preview').src=URL.createObjectURL(file);$('preview').hidden=false;current.source={name:file.name,type:file.type,size:file.size,lastModified:file.lastModified,origin:source};try{current.metadata=window.exifr?serialise(await exifr.parse(file,{tiff:true,exif:true,gps:true,xmp:true,iptc:true,icc:false})):null}catch(e){current.metadata={metadataError:e.message}}current.thumb=await thumbFrom(file);$('meta').textContent=JSON.stringify({file:current.source,exif:current.metadata},null,2);try{const r=await recogniseLabel(file),name=r.name,date=r.date;if(r.brand&&!$('fBrand').value)$('fBrand').value=r.brand;if(name)$('fName').value=name;if(date)$('fExp').value=date;$('meta').textContent=JSON.stringify({file:current.source,exif:current.metadata,ocr:{methods:r.methods,errors:r.errors,passes:r.passes,text:r.text}},null,2);$('ocrStatus').textContent=name&&date?(r.strong?'Product name and expiry date filled automatically.':'Name and a date were found, but the date has no EXP/Best before label next to it. Please check it.'):name?'Product name found. Check or enter the expiry date.':date?'Expiry date found. Check or enter the product name.':'No reliable text found'+(r.errors.length?' ('+r.errors.join(' | ')+')':'')+'. Try a closer, sharper picture of the label or the date.'}catch(e){$('ocrStatus').textContent='OCR could not run: '+e.message}}
async function useUrl(url){try{$('ocrStatus').textContent='Importing picture from Google Photos…';const r=await fetch(url,{mode:'cors'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.blob();await useFile(new File([b],'google-photos-image.'+(b.type.split('/')[1]||'jpg'),{type:b.type,lastModified:Date.now()}),'Google Photos')}catch(e){$('ocrStatus').textContent='Google Photos did not provide the image file. Download it or use Google Photos → Share → Save to device, then drop the saved file here. Metadata can only be retained when the original file is supplied.'}}
const drop=$('drop');drop.onclick=e=>{if(!e.target.closest('button'))$('file').click()};drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('file').click()};['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>{const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(files[0])return useFile(files[0],'drag-and-drop');const uri=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');if(/^https?:/i.test(uri))useUrl(uri.trim())});$('file').onchange=e=>useFile(e.target.files[0],'file-picker');
async function handlePaste(e){
  const items=[...(e.clipboardData?.items||[])];
  const imageItem=items.find(i=>i.kind==='file'&&i.type.startsWith('image/'));
  if(!imageItem)return;
  e.preventDefault();
  const blob=imageItem.getAsFile();
  if(!blob)return;
  const ext=(blob.type.split('/')[1]||'png').replace('jpeg','jpg');
  const file=new File([blob],blob.name||`pasted-image.${ext}`,{type:blob.type,lastModified:blob.lastModified||Date.now()});
  if(!$('addDlg').open){$('addBtn').click();}
  $('ocrStatus').textContent='Pasted picture received. Reading metadata and OCR…';
  await useFile(file,'clipboard-paste');
}
document.addEventListener('paste',handlePaste);

$('addBtn').onclick=()=>{$('addDlg').showModal();current={thumb:'',metadata:null,source:null};['fName','fBrand','fExp'].forEach(x=>$(x).value='');$('fQty').value=1;$('preview').hidden=true;$('meta').textContent='No picture selected.';$('ocrStatus').textContent=''};$('saveBtn').onclick=()=>{if(!$('fName').value.trim()||!$('fExp').value)return alert('Product name and expiry date are required.');state.items.push({id:crypto.randomUUID(),name:$('fName').value.trim(),brand:$('fBrand').value.trim(),expiry:$('fExp').value,qty:+$('fQty').value||1,warning:+state.settings.warning,thumb:current.thumb,metadata:current.metadata,source:current.source});save();render();$('addDlg').close()};$('clearPhoto').onclick=()=>{current={thumb:'',metadata:null,source:null};$('preview').hidden=true;$('meta').textContent='No picture selected.';$('ocrStatus').textContent=''};
$('list').onclick=e=>{const id=e.target.dataset.del;if(id&&confirm('Remove this product?')){state.items=state.items.filter(x=>x.id!==id);save();render()}};$('q').oninput=render;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
const textKeys=['title','subtitle','settingsButton','addButton','searchPlaceholder','addHeading','dropTitle','dropHint','nameLabel','brandLabel','expiryLabel','qtyLabel','saveButton','emptyText'];$('textSettings').innerHTML=textKeys.map(k=>`<div class="field"><label>${k.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase())}</label><input name="${k}"></div>`).join('');$('settingsBtn').onclick=()=>{const f=$('settingsForm');for(const[k,v]of Object.entries(state.settings))if(f.elements[k])f.elements[k].value=v;$('settingsDlg').showModal()};$('settingsForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);for(const[k,v]of fd)state.settings[k]=v;save();applySettings();$('settingsDlg').close()};$('resetSettings').onclick=()=>{if(confirm('Reset all settings to their defaults?')){state.settings={...defaults,geminiKey:state.settings.geminiKey};save();applySettings();$('settingsDlg').close()}};
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...state,settings:{...state.settings,geminiKey:''}},null,2)],{type:'application/json'}));a.download='expiry-watch-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.items))throw Error('Invalid backup');state={items:x.items,settings:{...defaults,...x.settings,geminiKey:state.settings.geminiKey}};save();applySettings();alert('Import completed.')}catch(err){alert('Import failed: '+err.message)}};$('clearAll').onclick=()=>{if(confirm('Delete every catalogue item? This cannot be undone.')){state.items=[];save();render()}};
